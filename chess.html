<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuoPlay Chess</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.4.0/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        linear-gradient(
            rgba(100, 160, 135, 0.35),
            rgba(10, 70, 50, 0.65)
        ),
        linear-gradient(
            180deg,
            #a8ddd2 0%,
            #82b79c 48%,
            #356e52 49%,
            #174b38 100%
        );
    position: relative;
}

/* Mountain background */
body::before,
body::after {
    content: "";
    position: fixed;
    bottom: 16%;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 310px solid rgba(40, 90, 75, 0.48);
    z-index: 0;
}

body::before {
    left: -100px;
}

body::after {
    right: -100px;
    border-bottom-color: rgba(35, 85, 68, 0.42);
}

/* Header */
.header {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: rgba(7, 35, 29, 0.72);
    border-bottom: 1px solid rgba(255,255,255,0.15);
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff4c9;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f2bd57;
}

.dot.connected {
    background: #36d477;
}

/* Main */
.main {
    position: relative;
    z-index: 2;
    width: min(1200px, 96%);
    margin: 22px auto 40px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.game-title {
    font-size: 27px;
    font-weight: 800;
}

.back-btn {
    border: 0;
    border-radius: 22px;
    padding: 11px 20px;
    color: white;
    background: rgba(7, 50, 40, 0.75);
    cursor: pointer;
    font-size: 15px;
}

.back-btn:hover {
    background: rgba(7, 50, 40, 0.95);
}

/* Layout */
.game-layout {
    display: grid;
    grid-template-columns: minmax(500px, 760px) 290px;
    gap: 22px;
    justify-content: center;
}

/* Board panel */
.board-panel {
    background: rgba(5, 57, 45, 0.90);
    border-radius: 26px;
    padding: 22px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.28);
}

.player-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
    padding: 8px 12px;
}

.player-name {
    font-size: 18px;
    font-weight: 700;
}

.player-color {
    color: #ffdf88;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Chess board */
#board {
    width: min(100%, 700px);
    aspect-ratio: 1 / 1;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 6px solid #073b2e;
    border-radius: 15px;
    overflow: hidden;
    box-shadow:
        0 12px 30px rgba(0,0,0,0.35),
        0 0 0 2px rgba(255,220,140,0.35);
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    aspect-ratio: 1 / 1;
}

.light {
    background: #f1ddb4;
}

.dark {
    background: #b88d67;
}

.square.selected {
    box-shadow: inset 0 0 0 5px rgba(255, 215, 74, 0.9);
}

.square.legal::after {
    content: "";
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: rgba(30, 100, 70, 0.55);
    position: absolute;
}

.square.capture::after {
    content: "";
    position: absolute;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    border: 5px solid rgba(180, 55, 45, 0.55);
}

.piece {
    font-size: clamp(34px, 6vw, 68px);
    line-height: 1;
    position: relative;
    z-index: 2;
    text-shadow:
        1px 2px 2px rgba(0,0,0,0.55);
}

.white-piece {
    color: #fff8e8;
}

.black-piece {
    color: #29251f;
}

/* Side panel */
.side {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    background: rgba(5, 57, 45, 0.90);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.20);
}

.card-label {
    color: #f4cf75;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 9px;
}

.card-value {
    font-size: 20px;
    font-weight: 700;
}

.status {
    min-height: 45px;
    line-height: 1.4;
}

.last-move {
    min-height: 25px;
    color: #f6dfab;
}

.moves {
    max-height: 180px;
    overflow-y: auto;
    color: #e7e0cc;
    font-size: 14px;
    line-height: 1.8;
}

.waiting {
    color: #f5d57b;
}

.success {
    color: #55e391;
}

.error {
    color: #ff8f8f;
}

.turn-active {
    color: #55e391;
}

/* Responsive */
@media (max-width: 900px) {
    .game-layout {
        grid-template-columns: 1fr;
    }

    .side {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .board-panel {
        padding: 12px;
    }
}

@media (max-width: 600px) {
    .header {
        padding: 0 15px;
    }

    .logo {
        font-size: 24px;
    }

    .game-title {
        font-size: 22px;
    }

    .main {
        width: 98%;
        margin-top: 12px;
    }

    .side {
        grid-template-columns: 1fr;
    }

    .piece {
        font-size: 10vw;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">DuoPlay</div>

    <div class="connection">
        <span class="dot" id="connectionDot"></span>
        <span id="connectionText">Connecting...</span>
    </div>
</header>

<main class="main">

    <div class="topbar">
        <div class="game-title">Chess</div>

        <button class="back-btn" onclick="goBack()">
            ← Game Room
        </button>
    </div>

    <div class="game-layout">

        <section class="board-panel">

            <div class="player-bar">
                <div class="player-name" id="opponentName">
                    Opponent
                </div>

                <div class="player-color" id="opponentColor">
                    Waiting
                </div>
            </div>

            <div id="board"></div>

            <div class="player-bar">
                <div class="player-name" id="myName">
                    You
                </div>

                <div class="player-color" id="myColor">
                    Waiting
                </div>
            </div>

        </section>

        <aside class="side">

            <div class="card">
                <div class="card-label">YOUR COLOR</div>
                <div class="card-value" id="colorText">
                    Waiting...
                </div>
            </div>

            <div class="card">
                <div class="card-label">TURN</div>
                <div class="card-value" id="turnText">
                    Waiting...
                </div>
            </div>

            <div class="card">
                <div class="card-label">STATUS</div>
                <div class="card-value status" id="statusText">
                    Connecting to DuoPlay...
                </div>
            </div>

            <div class="card">
                <div class="card-label">LAST ACTION</div>
                <div class="card-value last-move" id="lastMove">
                    Waiting...
                </div>
            </div>

            <div class="card">
                <div class="card-label">MOVE HISTORY</div>
                <div class="moves" id="moveHistory">
                    No moves yet.
                </div>
            </div>

        </aside>

    </div>

</main>

<script>
/* =====================================================
   DUOPLAY CHESS CLIENT
   ===================================================== */

const SERVER_URL = "https://duoplayserver.onrender.com";

const socket = io(SERVER_URL, {
    transports: ["websocket", "polling"]
});

let chess = new Chess();

let playerId =
    localStorage.getItem("duoplay_player_id");

let gameId = null;
let myColor = null;
let opponentId = null;

let selectedSquare = null;
let gameStarted = false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const boardElement =
    document.getElementById("board");

const statusText =
    document.getElementById("statusText");

const colorText =
    document.getElementById("colorText");

const turnText =
    document.getElementById("turnText");

const lastMove =
    document.getElementById("lastMove");

const moveHistory =
    document.getElementById("moveHistory");

const myColorElement =
    document.getElementById("myColor");

const opponentColorElement =
    document.getElementById("opponentColor");

const connectionText =
    document.getElementById("connectionText");

const connectionDot =
    document.getElementById("connectionDot");


/* =====================================================
   CONNECTION
   ===================================================== */

socket.on("connect", () => {

    connectionText.textContent = "Connected";
    connectionDot.classList.add("connected");

    statusText.textContent =
        "Connected to DuoPlay.";

    /*
       Register the SAME player ID.

       If localStorage already contains the ID,
       the server restores that player.
    */

    socket.emit(
        "register-player",
        playerId || null
    );
});


socket.on("disconnect", () => {

    connectionText.textContent =
        "Disconnected";

    connectionDot.classList.remove("connected");

    statusText.textContent =
        "Connection lost. Reconnecting...";

});


socket.on("connect_error", () => {

    connectionText.textContent =
        "Connection error";

    connectionDot.classList.remove("connected");

    statusText.textContent =
        "Could not connect to DuoPlay.";

});


/* =====================================================
   PLAYER REGISTERED
   ===================================================== */

socket.on("player-registered", (data) => {

    if (!data || !data.playerId) {
        return;
    }

    playerId = data.playerId;

    /*
       VERY IMPORTANT:

       Save the ID permanently in this browser.
       Refreshing does NOT generate another ID.
    */

    localStorage.setItem(
        "duoplay_player_id",
        playerId
    );

    document.getElementById("myName").textContent =
        "You • " + playerId;

    tryRecoverGame();
});


/* =====================================================
   CHESS GAME START
   ===================================================== */

socket.on("chess-game-start", (data) => {

    console.log("Chess game started:", data);

    if (!data || !data.gameId) {
        return;
    }

    gameId = data.gameId;
    myColor = data.color;
    opponentId = data.opponentId;

    /*
       Store the game information.

       This is important if the page is refreshed.
    */

    sessionStorage.setItem(
        "duoplay_game_id",
        gameId
    );

    sessionStorage.setItem(
        "duoplay_game_color",
        myColor
    );

    sessionStorage.setItem(
        "duoplay_opponent_id",
        opponentId
    );

    startGame();
});


/* =====================================================
   CHESS GAME JOINED
   ===================================================== */

socket.on("chess-game-joined", (data) => {

    console.log("Joined chess game:", data);

    if (!data || !data.gameId) {
        return;
    }

    gameId = data.gameId;
    myColor = data.color;
    opponentId = data.opponentId;

    startGame();
});


/* =====================================================
   RECOVER GAME
   ===================================================== */

function tryRecoverGame() {

    const savedGame =
        sessionStorage.getItem("duoplay_game_id");

    const savedColor =
        sessionStorage.getItem("duoplay_game_color");

    const savedOpponent =
        sessionStorage.getItem("duoplay_opponent_id");

    /*
       If games.html already saved the game information,
       use it.
    */

    if (savedGame) {

        gameId = savedGame;
        myColor = savedColor;
        opponentId = savedOpponent;

        socket.emit(
            "join-chess-game",
            gameId
        );

        return;
    }

    /*
       Also support URL:

       chess.html?gameId=xxxxx&color=white
    */

    const params =
        new URLSearchParams(window.location.search);

    const urlGameId =
        params.get("gameId");

    const urlColor =
        params.get("color");

    if (urlGameId) {

        gameId = urlGameId;
        myColor = urlColor || "white";

        sessionStorage.setItem(
            "duoplay_game_id",
            gameId
        );

        sessionStorage.setItem(
            "duoplay_game_color",
            myColor
        );

        socket.emit(
            "join-chess-game",
            gameId
        );

        return;
    }

    /*
       Do NOT immediately say that the player is not
       in a game while the socket is still connecting.
    */

    statusText.textContent =
        "Waiting for chess game...";
}


/* =====================================================
   START GAME
   ===================================================== */

function startGame() {

    if (!gameId || !myColor) {
        statusText.textContent =
            "Waiting for chess game...";
        return;
    }

    gameStarted = true;

    chess = new Chess();

    selectedSquare = null;

    document.getElementById("myName").textContent =
        "You • " + playerId;

    document.getElementById("opponentName").textContent =
        "Opponent • " + (opponentId || "Player");

    myColorElement.textContent =
        myColor;

    opponentColorElement.textContent =
        myColor === "white"
            ? "black"
            : "white";

    colorText.textContent =
        myColor.toUpperCase();

    statusText.textContent =
        "Chess game started.";

    statusText.className =
        "card-value status success";

    renderBoard();

    updateTurn();

    socket.emit(
        "join-chess-game",
        gameId
    );
}


/* =====================================================
   DRAW BOARD
   ===================================================== */

function renderBoard() {

    boardElement.innerHTML = "";

    const board =
        chess.board();

    let rows = board;

    /*
       Black player sees the board from black's side.
    */

    if (myColor === "black") {
        rows = [...board]
            .reverse()
            .map(row => [...row].reverse());
    }

    rows.forEach((row, rowIndex) => {

        row.forEach((piece, colIndex) => {

            const square =
                document.createElement("div");

            const actualRow =
                myColor === "black"
                    ? 7 - rowIndex
                    : rowIndex;

            const actualCol =
                myColor === "black"
                    ? 7 - colIndex
                    : colIndex;

            const file =
                String.fromCharCode(
                    97 + actualCol
                );

            const rank =
                8 - actualRow;

            const squareName =
                file + rank;

            square.className =
                "square " +
                (
                    (actualRow + actualCol) % 2 === 0
                        ? "light"
                        : "dark"
                );

            square.dataset.square =
                squareName;

            if (selectedSquare === squareName) {
                square.classList.add("selected");
            }

            if (piece) {

                const pieceElement =
                    document.createElement("div");

                pieceElement.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );

                pieceElement.textContent =
                    getPieceSymbol(
                        piece.color,
                        piece.type
                    );

                square.appendChild(
                    pieceElement
                );
            }

            square.addEventListener(
                "click",
                () => handleSquareClick(squareName)
            );

            boardElement.appendChild(square);
        });
    });

    showLegalMoves();
}


/* =====================================================
   CHESS PIECES
   ===================================================== */

function getPieceSymbol(color, type) {

    const pieces = {

        w: {
            p: "♙",
            r: "♖",
            n: "♘",
            b: "♗",
            q: "♕",
            k: "♔"
        },

        b: {
            p: "♟",
            r: "♜",
            n: "♞",
            b: "♝",
            q: "♛",
            k: "♚"
        }
    };

    return pieces[color][type];
}


/* =====================================================
   CLICK SQUARE
   ===================================================== */

function handleSquareClick(square) {

    if (!gameStarted) {
        return;
    }

    if (!myColor) {
        return;
    }

    const turn =
        chess.turn() === "w"
            ? "white"
            : "black";

    if (turn !== myColor) {

        statusText.textContent =
            "Wait for your turn.";

        return;
    }

    const piece =
        chess.get(square);

    /*
       First click: select your own piece.
    */

    if (!selectedSquare) {

        if (!piece) {
            return;
        }

        if (
            piece.color !==
            (myColor === "white" ? "w" : "b")
        ) {
            return;
        }

        selectedSquare = square;

        renderBoard();

        return;
    }


    /*
       Clicking another own piece changes selection.
    */

    if (
        piece &&
        piece.color ===
        (myColor === "white" ? "w" : "b")
    ) {

        selectedSquare = square;

        renderBoard();

        return;
    }


    /*
       Try the move.
    */

    const move = chess.move({
        from: selectedSquare,
        to: square,
        promotion: "q"
    });

    if (!move) {

        statusText.textContent =
            "Illegal move.";

        selectedSquare = null;

        renderBoard();

        return;
    }


    selectedSquare = null;

    renderBoard();

    updateTurn();

    addMoveToHistory(move);

    lastMove.textContent =
        move.san;


    /*
       Send move to opponent.
    */

    socket.emit("chess-move", {
        gameId,
        move: {
            from: move.from,
            to: move.to,
            promotion: move.promotion
        }
    });


    checkGameEnd();
}


/* =====================================================
   OPPONENT MOVE
   ===================================================== */

socket.on("opponent-move", (data) => {

    if (!data || !data.move) {
        return;
    }

    if (!gameId) {
        return;
    }

    const move = chess.move({
        from: data.move.from,
        to: data.move.to,
        promotion: data.move.promotion || "q"
    });

    if (!move) {

        console.error(
            "Opponent move could not be applied."
        );

        return;
    }

    selectedSquare = null;

    renderBoard();

    updateTurn();

    addMoveToHistory(move);

    lastMove.textContent =
        move.san;

    checkGameEnd();
});


/* =====================================================
   SERVER TURN
   ===================================================== */

socket.on("chess-turn", (data) => {

    updateTurn();
});


/* =====================================================
   UPDATE TURN
   ===================================================== */

function updateTurn() {

    if (!gameStarted) {
        turnText.textContent =
            "Waiting...";
        return;
    }

    const turn =
        chess.turn() === "w"
            ? "white"
            : "black";

    if (turn === myColor) {

        turnText.textContent =
            "Your turn";

        turnText.className =
            "card-value turn-active";

        statusText.textContent =
            "Your move.";

        statusText.className =
            "card-value status success";

    } else {

        turnText.textContent =
            "Opponent's turn";

        turnText.className =
            "card-value";

        statusText.textContent =
            "Waiting for opponent.";

        statusText.className =
            "card-value status";
    }
}


/* =====================================================
   LEGAL MOVES
   ===================================================== */

function showLegalMoves() {

    if (!selectedSquare) {
        return;
    }

    let moves = [];

    try {
        moves =
            chess.moves({
                square: selectedSquare,
                verbose: true
            });
    } catch (error) {
        return;
    }

    moves.forEach(move => {

        const element =
            document.querySelector(
                `[data-square="${move.to}"]`
            );

        if (!element) {
            return;
        }

        if (move.captured) {
            element.classList.add("capture");
        } else {
            element.classList.add("legal");
        }
    });
}


/* =====================================================
   MOVE HISTORY
   ===================================================== */

let moveNumber = 0;

function addMoveToHistory(move) {

    const currentMove =
        ++moveNumber;

    if (
        moveNumber % 2 === 1
    ) {
        const row =
            document.createElement("div");

        row.id =
            "move-" + currentMove;

        row.textContent =
            Math.ceil(moveNumber / 2) +
            ". " +
            move.san;

        moveHistory.appendChild(row);

    } else {

        const rows =
            moveHistory.children;

        if (rows.length > 0) {

            rows[rows.length - 1].textContent +=
                "   " + move.san;
        }
    }

    moveHistory.scrollTop =
        moveHistory.scrollHeight;
}


/* =====================================================
   GAME END
   ===================================================== */

function checkGameEnd() {

    if (chess.isCheckmate()) {

        const winner =
            chess.turn() === "w"
                ? "black"
                : "white";

        statusText.textContent =
            winner === myColor
                ? "You won!"
                : "You lost.";

        socket.emit(
            "chess-game-finished",
            {
                gameId,
                winner
            }
        );

        return;
    }

    if (chess.isDraw()) {

        statusText.textContent =
            "Game drawn.";

        socket.emit(
            "chess-game-finished",
            {
                gameId,
                winner: "draw"
            }
        );
    }
}


/* =====================================================
   SERVER ERRORS
   ===================================================== */

socket.on("chess-game-error", (data) => {

    console.error(
        "Chess game error:",
        data
    );

    statusText.textContent =
        data && data.message
            ? data.message
            : "Chess game error.";

    statusText.className =
        "card-value status error";
});


socket.on("chess-move-error", (data) => {

    statusText.textContent =
        data && data.message
            ? data.message
            : "Move rejected.";

});


socket.on("error-message", (message) => {

    console.error(message);

    statusText.textContent =
        message || "Server error.";

});


/* =====================================================
   BACK TO GAME ROOM
   ===================================================== */

function goBack() {

    window.location.href =
        "games.html";
}


/* =====================================================
   INITIAL STATE
   ===================================================== */

document.getElementById("myName").textContent =
    playerId
        ? "You • " + playerId
        : "You";

renderBoard();

if (socket.connected) {
    tryRecoverGame();
}

</script>

</body>
</html>
