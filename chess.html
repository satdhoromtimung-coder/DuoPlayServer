<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuoPlay — Chess</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Arial, sans-serif;

    color: white;

    background:
        linear-gradient(
            180deg,
            #79c9c5 0%,
            #a8ddd0 34%,
            #709b70 68%,
            #153d2c 100%
        );
}

/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;
    inset: 0;

    z-index: -10;

    overflow: hidden;
}

.sun {
    position: absolute;

    width: 140px;
    height: 140px;

    top: 7%;
    right: 9%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffde3,
            #ffe8a0 55%,
            #ffd36d
        );

    box-shadow:
        0 0 55px #ffe8a0;
}

.cloud {
    position: absolute;

    width: 190px;
    height: 45px;

    border-radius: 50px;

    background:
        rgba(255,255,255,.32);

    animation:
        cloudMove 50s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,.35);
}

.cloud::before {
    width: 80px;
    height: 80px;

    left: 25px;
    bottom: 0;
}

.cloud::after {
    width: 62px;
    height: 62px;

    right: 25px;
    bottom: 0;
}

.cloud.one {
    top: 15%;
    left: -230px;
}

.cloud.two {
    top: 30%;
    left: -350px;

    transform: scale(.7);

    animation-duration: 65s;
    animation-delay: -20s;
}

@keyframes cloudMove {

    from {
        margin-left: 0;
    }

    to {
        margin-left:
            calc(100vw + 600px);
    }

}

.mountains {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 21%;

    height: 46%;
}

.mountain {
    position: absolute;

    bottom: 0;

    width: 0;
    height: 0;

    border-left:
        230px solid transparent;

    border-right:
        230px solid transparent;

    border-bottom:
        350px solid #628a80;
}

.mountain.one {
    left: -180px;
}

.mountain.two {
    left: 17%;

    transform: scale(.78);
}

.mountain.three {
    left: 43%;

    transform: scale(1.12);

    border-bottom-color:
        #547b71;
}

.mountain.four {
    left: 72%;

    transform: scale(.8);
}

.ground {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 22%;

    background:
        linear-gradient(
            to top,
            #153d2c,
            rgba(35,100,67,.72)
        );
}

/* =====================================================
   HEADER
===================================================== */

header {
    min-height: 72px;

    padding:
        12px 24px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background:
        rgba(8,47,37,.18);

    border-bottom:
        1px solid rgba(255,255,255,.12);
}

.logo {
    font-family: Georgia, serif;

    font-size: 34px;

    font-weight: bold;

    color: #ffe19a;

    text-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

.room-info {
    display: flex;

    align-items: center;

    gap: 10px;
}

.room-id {
    padding:
        9px 13px;

    border-radius: 20px;

    background:
        rgba(8,47,37,.62);

    color: #cde2da;

    font-family: monospace;

    font-size: 12px;
}

.leave-btn {
    border: 0;

    padding:
        9px 13px;

    border-radius: 11px;

    cursor: pointer;

    background:
        rgba(255,255,255,.12);

    color: white;

    font-weight: bold;
}

/* =====================================================
   MAIN
===================================================== */

main {
    width:
        min(760px, 94%);

    margin:
        25px auto 60px;
}

.game-title {
    margin: 0;

    text-align: center;

    font-family: Georgia, serif;

    font-size:
        clamp(36px, 6vw, 52px);

    color: #fff0bd;

    text-shadow:
        0 5px 18px rgba(0,0,0,.25);
}

.status {
    margin:
        7px auto 20px;

    width: fit-content;

    padding:
        8px 16px;

    border-radius: 20px;

    background:
        rgba(8,47,37,.65);

    color: #dcece6;

    font-size: 13px;
}

/* =====================================================
   PLAYERS
===================================================== */

.players {
    display: flex;

    justify-content: center;

    gap: 15px;

    margin-bottom: 18px;
}

.player-card {
    min-width: 145px;

    padding:
        11px 15px;

    border-radius: 14px;

    background:
        rgba(8,47,37,.70);

    border:
        1px solid rgba(255,255,255,.12);

    text-align: center;
}

.player-label {
    display: block;

    margin-bottom: 4px;

    color: #a9cfc3;

    font-size: 11px;

    letter-spacing: 1px;
}

.player-name {
    color: #ffe39a;

    font-family: monospace;

    font-size: 14px;

    font-weight: bold;
}

/* =====================================================
   CHESS BOARD
===================================================== */

.board-wrapper {
    width:
        min(620px, 92vw);

    margin:
        0 auto;

    padding: 10px;

    border-radius: 18px;

    background:
        rgba(7,34,27,.82);

    box-shadow:
        0 25px 65px rgba(0,0,0,.38);

    border:
        1px solid rgba(255,255,255,.14);
}

.board {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    overflow: hidden;

    border-radius: 8px;
}

/* =====================================================
   SQUARES
===================================================== */

.square {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;

    aspect-ratio: 1 / 1;
}

.light {
    background:
        #f0d9b5;
}

.dark {
    background:
        #b58863;
}

.square.selected {
    box-shadow:
        inset 0 0 0 5px
        rgba(255,220,100,.75);
}

.square.legal::after {
    content: "";

    position: absolute;

    width: 25%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    background:
        rgba(20,60,35,.55);
}

.square.capture::after {
    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:
        5px solid rgba(180,50,40,.65);
}

/* =====================================================
   CHESS PIECES
===================================================== */

.piece {
    position: relative;

    z-index: 2;

    font-family:
        "DejaVu Sans",
        "Segoe UI Symbol",
        serif;

    font-size:
        clamp(31px, 7.5vw, 66px);

    line-height: 1;

    cursor: pointer;

    user-select: none;

    filter:
        drop-shadow(
            0 3px 2px
            rgba(0,0,0,.38)
        );
}

.white-piece {
    color: #fffaf0;

    text-shadow:
        0 1px 2px #555,
        0 0 2px #333;
}

.black-piece {
    color: #171717;

    text-shadow:
        0 1px 1px rgba(255,255,255,.25);
}

/* =====================================================
   RESULT
===================================================== */

.result-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(8px);
}

.result-overlay.show {
    display: flex;
}

.result-box {
    width:
        min(390px, 100%);

    padding:
        32px 25px;

    border-radius: 25px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #164b3c,
            #082e24
        );

    border:
        1px solid rgba(255,255,255,.17);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55);
}

.result-icon {
    font-size: 54px;

    margin-bottom: 8px;
}

.result-box h2 {
    margin:
        0 0 8px;

    color: #ffe4a0;

    font-family: Georgia, serif;
}

.result-box p {
    margin:
        0 0 22px;

    color: #c9dfd7;
}

.result-buttons {
    display: flex;

    gap: 10px;
}

.result-buttons button {
    flex: 1;

    border: 0;

    padding: 13px;

    border-radius: 13px;

    cursor: pointer;

    font-weight: bold;
}

.back-btn {
    background:
        linear-gradient(
            135deg,
            #f7d987,
            #dca84f
        );

    color: #2c210f;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 200;

    transform:
        translate(-50%, 30px);

    opacity: 0;

    pointer-events: none;

    padding:
        13px 19px;

    border-radius: 13px;

    background:
        rgba(7,32,26,.95);

    border:
        1px solid rgba(255,255,255,.15);

    color: white;

    font-size: 14px;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    header {
        padding:
            10px 14px;
    }

    .logo {
        font-size: 27px;
    }

    .room-id {
        display: none;
    }

    main {
        margin-top: 20px;
    }

    .players {
        gap: 8px;
    }

    .player-card {
        min-width: 125px;

        padding:
            9px 10px;
    }

    .board-wrapper {
        padding: 7px;
    }

}
</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="mountains">

        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>
        <div class="mountain four"></div>

    </div>

    <div class="ground"></div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        DuoPlay
    </div>

    <div class="room-info">

        <div
            id="roomId"
            class="room-id"
        >
            Room: ------
        </div>

        <button
            id="leaveBtn"
            class="leave-btn"
        >
            LEAVE
        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

    <h1 class="game-title">
        Chess
    </h1>

    <div
        id="status"
        class="status"
    >
        Connecting to Chess...
    </div>


    <div class="players">

        <div class="player-card">

            <span class="player-label">
                WHITE
            </span>

            <span
                id="whitePlayer"
                class="player-name"
            >
                ----
            </span>

        </div>

        <div class="player-card">

            <span class="player-label">
                BLACK
            </span>

            <span
                id="blackPlayer"
                class="player-name"
            >
                ----
            </span>

        </div>

    </div>


    <!-- =================================================
         BOARD
    ================================================== -->

    <div class="board-wrapper">

        <div
            id="board"
            class="board"
        ></div>

    </div>

</main>


<!-- =====================================================
     RESULT
===================================================== -->

<div
    id="resultOverlay"
    class="result-overlay"
>

    <div class="result-box">

        <div
            id="resultIcon"
            class="result-icon"
        >
            ♛
        </div>

        <h2 id="resultTitle">
            Game Over
        </h2>

        <p id="resultText">
            Chess game finished.
        </p>

        <div class="result-buttons">

            <button
                id="backBtn"
                class="back-btn"
            >
                BACK TO PLAYERS
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =====================================================
   SERVER
===================================================== */

const SERVER =
    window.location.origin;


/* =====================================================
   PLAYER ID
===================================================== */

const myPlayerId =
    localStorage.getItem(
        "duoplayPlayerId"
    );


/* =====================================================
   SAVED GAME
===================================================== */

let savedGame = null;

try {

    savedGame =
        JSON.parse(
            localStorage.getItem(
                "duoplayGame"
            ) || "null"
        );

}
catch {

    savedGame = null;

}


/* =====================================================
   SOCKET
===================================================== */

const socket =
    io(
        SERVER,
        {
            transports: [
                "websocket",
                "polling"
            ],

            auth: {
                playerId:
                    myPlayerId || null
            },

            reconnection: true
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const board =
    document.getElementById(
        "board"
    );

const status =
    document.getElementById(
        "status"
    );

const roomIdElement =
    document.getElementById(
        "roomId"
    );

const whitePlayer =
    document.getElementById(
        "whitePlayer"
    );

const blackPlayer =
    document.getElementById(
        "blackPlayer"
    );

const leaveBtn =
    document.getElementById(
        "leaveBtn"
    );

const resultOverlay =
    document.getElementById(
        "resultOverlay"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultText =
    document.getElementById(
        "resultText"
    );

const resultIcon =
    document.getElementById(
        "resultIcon"
    );

const backBtn =
    document.getElementById(
        "backBtn"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   GAME STATE
===================================================== */

let gameData =
    savedGame;

let myColor =
    null;

let currentTurn =
    "white";

let selectedSquare =
    null;

let boardPosition =
    null;

let gameFinished =
    false;


/* =====================================================
   CHESS START POSITION
===================================================== */

const START_POSITION = [

    [
        "black-rook",
        "black-knight",
        "black-bishop",
        "black-queen",
        "black-king",
        "black-bishop",
        "black-knight",
        "black-rook"
    ],

    [
        "black-pawn",
        "black-pawn",
        "black-pawn",
        "black-pawn",
        "black-pawn",
        "black-pawn",
        "black-pawn",
        "black-pawn"
    ],

    [
        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null
    ],

    [
        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null
    ],

    [
        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null
    ],

    [
        null,
        null,
        null,
        null,
        null,
        null,
        null,
        null
    ],

    [
        "white-pawn",
        "white-pawn",
        "white-pawn",
        "white-pawn",
        "white-pawn",
        "white-pawn",
        "white-pawn",
        "white-pawn"
    ],

    [
        "white-rook",
        "white-knight",
        "white-bishop",
        "white-queen",
        "white-king",
        "white-bishop",
        "white-knight",
        "white-rook"
    ]

];


/* =====================================================
   PIECES
===================================================== */

const PIECES = {

    "white-king": "♔",
    "white-queen": "♕",
    "white-rook": "♖",
    "white-bishop": "♗",
    "white-knight": "♘",
    "white-pawn": "♙",

    "black-king": "♚",
    "black-queen": "♛",
    "black-rook": "♜",
    "black-bishop": "♝",
    "black-knight": "♞",
    "black-pawn": "♟"

};


/* =====================================================
   INITIALIZE GAME
===================================================== */

function initializeGame(data) {

    if (!data) {

        status.textContent =
            "Chess room not found.";

        return;

    }

    gameData =
        data;

    myColor =
        data.color;

    currentTurn =
        data.turn ||
        "white";


    roomIdElement.textContent =
        "Room: " +
        (
            data.roomId ||
            "------"
        );


    whitePlayer.textContent =
        data.whitePlayerId ||
        "----";

    blackPlayer.textContent =
        data.blackPlayerId ||
        "----";


    /*
        Create board from FEN.
    */

    boardPosition =
        fenToBoard(
            data.fen
        );


    renderBoard();

    updateStatus();

}


/* =====================================================
   FEN TO BOARD
===================================================== */

function fenToBoard(fen) {

    if (!fen) {

        return START_POSITION
            .map(row => [...row]);

    }

    const boardPart =
        fen.split(" ")[0];

    const rows =
        boardPart.split("/");

    const result = [];


    for (
        let r = 0;
        r < 8;
        r++
    ) {

        const row = [];

        for (
            const char of rows[r]
        ) {

            if (
                /[1-8]/.test(char)
            ) {

                const empty =
                    Number(char);

                for (
                    let i = 0;
                    i < empty;
                    i++
                ) {

                    row.push(null);

                }

            }
            else {

                row.push(
                    pieceFromFen(char)
                );

            }

        }

        result.push(row);

    }

    return result;

}


/* =====================================================
   FEN PIECE
===================================================== */

function pieceFromFen(char) {

    const white =
        char ===
        char.toUpperCase();

    const color =
        white
            ? "white"
            : "black";

    const lower =
        char.toLowerCase();


    const names = {

        k: "king",
        q: "queen",
        r: "rook",
        b: "bishop",
        n: "knight",
        p: "pawn"

    };


    return (
        color +
        "-" +
        names[lower]
    );

}


/* =====================================================
   BOARD TO FEN SQUARE
===================================================== */

function squareName(
    row,
    col
) {

    const files =
        "abcdefgh";

    const ranks =
        "87654321";

    return (
        files[col] +
        ranks[row]
    );

}


/* =====================================================
   FIND BOARD POSITION
===================================================== */

function getPosition(
    square
) {

    const files =
        "abcdefgh";

    const file =
        files.indexOf(
            square[0]
        );

    const rank =
        Number(
            square[1]
        );

    if (
        file < 0 ||
        rank < 1 ||
        rank > 8
    ) {
        return null;
    }

    return {

        row:
            8 - rank,

        col:
            file

    };

}


/* =====================================================
   RENDER BOARD
===================================================== */

function renderBoard() {

    board.innerHTML = "";


    /*
        Black sees the board from
        the opposite side.
    */

    const rows =
        myColor === "black"
            ? [7,6,5,4,3,2,1,0]
            : [0,1,2,3,4,5,6,7];

    const cols =
        myColor === "black"
            ? [7,6,5,4,3,2,1,0]
            : [0,1,2,3,4,5,6,7];


    rows.forEach(
        row => {

            cols.forEach(
                col => {

                    const square =
                        document.createElement(
                            "div"
                        );

                    square.className =
                        "square";


                    const light =
                        (
                            row + col
                        ) % 2 === 0;


                    square.classList.add(
                        light
                            ? "light"
                            : "dark"
                    );


                    const name =
                        squareName(
                            row,
                            col
                        );


                    square.dataset.square =
                        name;


                    /*
                        Selected square.
                    */

                    if (
                        selectedSquare ===
                        name
                    ) {

                        square.classList.add(
                            "selected"
                        );

                    }


                    const piece =
                        boardPosition[row][col];


                    if (piece) {

                        const pieceElement =
                            document.createElement(
                                "span"
                            );

                        pieceElement.className =
                            "piece " +
                            (
                                piece.startsWith(
                                    "white"
                                )
                                    ? "white-piece"
                                    : "black-piece"
                            );

                        pieceElement.textContent =
                            PIECES[piece];

                        square.appendChild(
                            pieceElement
                        );

                    }


                    square.onclick =
                        () => {

                            handleSquareClick(
                                name
                            );

                        };


                    board.appendChild(
                        square
                    );

                }
            );

        }
    );

}


/* =====================================================
   SQUARE CLICK
===================================================== */

function handleSquareClick(
    square
) {

    if (gameFinished) {
        return;
    }


    if (
        myColor !== currentTurn
    ) {

        showToast(
            "Wait for your turn."
        );

        return;

    }


    const position =
        getPosition(
            square
        );


    if (!position) {
        return;
    }


    const piece =
        boardPosition
            [position.row]
            [position.col];


    /*
        Nothing selected yet.
    */

    if (!selectedSquare) {

        if (!piece) {
            return;
        }


        const pieceColor =
            piece.startsWith(
                "white"
            )
                ? "white"
                : "black";


        if (
            pieceColor !==
            myColor
        ) {

            showToast(
                "That is not your piece."
            );

            return;

        }


        selectedSquare =
            square;

        renderBoard();

        return;

    }


    /*
        Click same square.
    */

    if (
        selectedSquare ===
        square
    ) {

        selectedSquare =
            null;

        renderBoard();

        return;

    }


    /*
        Select another own piece.
    */

    if (piece) {

        const pieceColor =
            piece.startsWith(
                "white"
            )
                ? "white"
                : "black";


        if (
            pieceColor ===
            myColor
        ) {

            selectedSquare =
                square;

            renderBoard();

            return;

        }

    }


    /*
        Send move to server.

        The server is the authority
        and checks the legal move.
    */

    socket.emit(
        "chessMove",
        {
            from:
                selectedSquare,

            to:
                square,

            promotion:
                "q"
        }
    );


    selectedSquare =
        null;

}


/* =====================================================
   MOVE MADE
===================================================== */

socket.on(
    "moveMade",
    data => {

        if (!data) {
            return;
        }


        boardPosition =
            fenToBoard(
                data.fen
            );


        currentTurn =
            data.turn;


        selectedSquare =
            null;


        renderBoard();

        updateStatus();


        if (
            data.check
        ) {

            showToast(
                "Check!"
            );

        }

    }
);


/* =====================================================
   MOVE ERROR
===================================================== */

socket.on(
    "moveError",
    message => {

        selectedSquare =
            null;

        renderBoard();

        showToast(
            message ||
            "Illegal move."
        );

    }
);


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateStatus() {

    if (gameFinished) {
        return;
    }


    if (
        myColor ===
        currentTurn
    ) {

        status.textContent =
            "Your turn";

    }
    else {

        status.textContent =
            "Opponent's turn";

    }

}


/* =====================================================
   GAME FINISHED
===================================================== */

socket.on(
    "gameFinished",
    data => {

        gameFinished =
            true;


        let result =
            data?.result ||
            "draw";


        if (
            result ===
            "draw"
        ) {

            resultIcon.textContent =
                "♔";

            resultTitle.textContent =
                "Draw";

            resultText.textContent =
                "The Chess game ended in a draw.";

        }
        else if (
            result ===
            myColor
        ) {

            resultIcon.textContent =
                "♛";

            resultTitle.textContent =
                "You Win!";

            resultText.textContent =
                "Congratulations! You won the Chess game.";

        }
        else {

            resultIcon.textContent =
                "♟";

            resultTitle.textContent =
                "You Lost";

            resultText.textContent =
                "The other player won the Chess game.";

        }


        resultOverlay.classList.add(
            "show"
        );

    }
);


/* =====================================================
   OPPONENT LEFT
===================================================== */

socket.on(
    "opponentLeft",
    data => {

        gameFinished =
            true;


        resultIcon.textContent =
            "♟";

        resultTitle.textContent =
            "Opponent Left";

        resultText.textContent =
            "The other player left the Chess game.";


        resultOverlay.classList.add(
            "show"
        );

    }
);


/* =====================================================
   SOCKET CONNECT
===================================================== */

socket.on(
    "connect",
    () => {

        console.log(
            "Chess connected:",
            socket.id
        );

        status.textContent =
            "Connected";

        /*
            If the saved room is valid,
            tell the server we are connected.

            The actual game room was already
            created by the server when the
            request was accepted.
        */

    }
);


/* =====================================================
   SOCKET DISCONNECT
===================================================== */

socket.on(
    "disconnect",
    () => {

        if (!gameFinished) {

            status.textContent =
                "Connection lost...";

        }

    }
);


/* =====================================================
   LEAVE
===================================================== */

function leaveGame() {

    socket.emit(
        "leaveChess"
    );


    localStorage.removeItem(
        "duoplayGame"
    );

    localStorage.removeItem(
        "duoplayRoomId"
    );


    window.location.href =
        "/games.html";

}


leaveBtn.onclick =
    leaveGame;


backBtn.onclick =
    leaveGame;


/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2200
    );

}


/* =====================================================
   START
===================================================== */

if (!myPlayerId) {

    status.textContent =
        "Player ID not found.";

}
else if (!gameData) {

    status.textContent =
        "No active Chess game.";

}
else {

    initializeGame(
        gameData
    );

}

</script>

</body>
</html>
