<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuoPlay Chess</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    background:
        linear-gradient(
            rgba(22,70,58,.62),
            rgba(8,35,27,.82)
        ),
        linear-gradient(
            135deg,
            #8fd3d1,
            #4e8d80 48%,
            #1e513e
        );

    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
}

.sun {
    position: absolute;
    width: 150px;
    height: 150px;
    right: 8%;
    top: 5%;

    border-radius: 50%;

    background: #fff0a8;

    box-shadow:
        0 0 50px #fff0a8;
}

.mountain {
    position: absolute;
    bottom: 13%;

    width: 0;
    height: 0;

    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 330px solid rgba(235,250,246,.45);
}

.mountain.one {
    left: -120px;
}

.mountain.two {
    left: 18%;

    border-bottom-color:
        rgba(205,235,230,.42);
}

.mountain.three {
    right: 17%;

    border-bottom-color:
        rgba(230,247,243,.45);
}

.mountain.four {
    right: -120px;
}

.grass {
    position: absolute;
    bottom: 0;

    width: 100%;
    height: 24%;

    background:
        linear-gradient(
            to top,
            rgba(20,65,45,.98),
            rgba(40,105,70,.72)
        );
}

/* TOP BAR */

.topbar {
    min-height: 70px;

    padding:
        12px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.logo {
    font-family: Georgia, serif;

    font-size: 34px;
    font-weight: bold;

    color: #ffe19a;

    text-shadow:
        0 2px 5px rgba(0,0,0,.35);
}

.top-right {
    display: flex;
    align-items: center;

    gap: 10px;
}

.player-id {
    padding: 10px 15px;

    border-radius: 25px;

    background:
        rgba(20,55,46,.58);

    border:
        1px solid rgba(255,255,255,.16);

    font-family: monospace;
    font-size: 12px;
}

.back {
    border: none;

    padding: 11px 18px;

    border-radius: 25px;

    background:
        rgba(20,55,46,.7);

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.back:hover {
    background:
        rgba(20,55,46,.9);
}

/* MAIN */

.container {
    width: min(1250px, 96%);

    margin:
        12px auto 50px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        300px;

    gap: 22px;

    align-items: start;
}

/* GAME CARD */

.game-card {
    background:
        rgba(7,45,35,.78);

    border:
        1px solid rgba(255,255,255,.14);

    border-radius: 24px;

    padding: 20px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.28);

    backdrop-filter:
        blur(12px);
}

/* PLAYER */

.player-bar {
    display: flex;
    align-items: center;

    gap: 15px;

    margin-bottom: 16px;
}

.player-icon {
    width: 58px;
    height: 58px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 31px;

    background:
        linear-gradient(
            145deg,
            #ffe9a9,
            #dda84f
        );

    color: #302515;

    box-shadow:
        0 7px 15px rgba(0,0,0,.25);
}

.player-info strong {
    display: block;

    font-size: 20px;
}

.player-info span {
    display: block;

    margin-top: 4px;

    color: #aef5c8;

    font-size: 14px;
}

.status-dot {
    display: inline-block;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #63f29d;

    margin-right: 6px;

    box-shadow:
        0 0 9px #63f29d;
}

/* BOARD */

.board-wrap {
    width: min(720px, 100%);

    margin: auto;

    padding: 12px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #edc777,
            #8e5e2c
        );

    box-shadow:
        0 15px 30px rgba(0,0,0,.35);
}

.board {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    overflow: hidden;

    border:
        4px solid #5c381d;

    border-radius: 7px;
}

.square {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;

    transition:
        filter .12s ease,
        box-shadow .12s ease;
}

.square.light {
    background: #f2d79d;
}

.square.dark {
    background: #95683b;
}

.square:hover {
    filter: brightness(1.08);
}

.square.selected {
    box-shadow:
        inset 0 0 0 5px #f7cf68;
}

.square.last {
    box-shadow:
        inset 0 0 0 4px
        rgba(255,224,117,.75);
}

.square.move-target::after {
    content: "";

    position: absolute;

    width: 23%;
    height: 23%;

    border-radius: 50%;

    background:
        rgba(60,45,25,.42);
}

.square.capture-target::after {
    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    border:
        5px solid rgba(255,226,112,.7);
}

/* PIECES */

.piece {
    position: relative;

    z-index: 2;

    font-family:
        "Times New Roman",
        serif;

    font-size:
        clamp(38px, 6vw, 72px);

    line-height: 1;

    filter:
        drop-shadow(
            0 4px 3px rgba(0,0,0,.55)
        );

    cursor: pointer;
}

.piece.white {
    color: #fffaf0;

    -webkit-text-stroke:
        1.5px #4e3c24;

    text-shadow:
        0 2px 2px #493820;
}

.piece.black {
    color: #16120d;

    -webkit-text-stroke:
        1px #000;

    text-shadow:
        0 3px 3px rgba(255,255,255,.12);
}

/* SIDE PANEL */

.side-panel {
    display: flex;

    flex-direction: column;

    gap: 14px;
}

.panel {
    background:
        rgba(8,48,38,.72);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 18px;

    padding: 18px;

    backdrop-filter:
        blur(10px);
}

.panel-title {
    color: #eac873;

    font-family: monospace;

    font-size: 12px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 12px;
}

.value {
    color: white;

    font-size: 17px;
}

.captured {
    min-height: 32px;

    display: flex;

    flex-wrap: wrap;

    gap: 2px;
}

.captured span {
    font-size: 25px;
}

.history {
    max-height: 180px;

    overflow-y: auto;

    font-family: monospace;

    font-size: 13px;
}

.history-row {
    display: flex;

    gap: 10px;

    padding: 4px 0;

    color: #e8e8e8;
}

.history-number {
    width: 25px;

    color: #d5b86d;
}

.game-status {
    color: #ffe9a9;

    line-height: 1.5;
}

/* BUTTONS */

.actions {
    display: flex;

    gap: 10px;
}

.action {
    flex: 1;

    padding: 12px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.05);

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.action:hover {
    background:
        rgba(255,255,255,.12);
}

.action.gold {
    background:
        linear-gradient(
            135deg,
            #f6da91,
            #dba94f
        );

    color: #241b0f;

    border: none;

    font-weight: bold;
}

/* WAITING */

.waiting {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(5,30,23,.62);

    backdrop-filter:
        blur(8px);
}

.waiting.show {
    display: flex;
}

.waiting-card {
    width: min(400px, 100%);

    padding: 35px 25px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #164b3c,
            #092f25
        );

    border:
        1px solid rgba(255,255,255,.15);

    text-align: center;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);
}

.loader {
    width: 48px;
    height: 48px;

    margin:
        0 auto 20px;

    border-radius: 50%;

    border:
        4px solid rgba(255,255,255,.15);

    border-top-color:
        #f2ce78;

    animation:
        spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.waiting-card h2 {
    margin:
        0 0 8px;

    color: #ffe3a0;
}

.waiting-card p {
    margin: 0;

    color: #d2e4dc;

    line-height: 1.5;
}

/* PROMOTION */

.promotion {
    position: fixed;

    inset: 0;

    z-index: 30;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.6);

    backdrop-filter:
        blur(6px);
}

.promotion.show {
    display: flex;
}

.promotion-box {
    background: #123d31;

    padding: 25px;

    border-radius: 20px;

    text-align: center;

    border:
        1px solid #dcb866;
}

.promotion-buttons {
    display: flex;

    gap: 10px;

    margin-top: 18px;
}

.promotion-buttons button {
    width: 60px;
    height: 60px;

    font-size: 40px;

    border-radius: 12px;

    border:
        1px solid #dcb866;

    background: #234d40;

    color: white;

    cursor: pointer;
}

/* RESPONSIVE */

@media(max-width:900px) {

    .container {
        grid-template-columns: 1fr;
    }

    .side-panel {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media(max-width:600px) {

    .topbar {
        padding: 10px 12px;
    }

    .logo {
        font-size: 25px;
    }

    .player-id {
        font-size: 9px;

        padding:
            8px 10px;
    }

    .back {
        font-size: 11px;

        padding:
            9px 11px;
    }

    .container {
        width: 100%;

        margin-top: 0;
    }

    .game-card {
        padding: 9px;

        border-radius: 18px;
    }

    .board-wrap {
        padding: 7px;

        border-radius: 13px;
    }

    .piece {
        font-size:
            clamp(30px, 11vw, 55px);
    }

    .side-panel {
        display: flex;
    }

    .panel {
        border-radius: 14px;
    }

    .actions {
        position: sticky;

        bottom: 8px;

        z-index: 5;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="sun"></div>

    <div class="mountain one"></div>
    <div class="mountain two"></div>
    <div class="mountain three"></div>
    <div class="mountain four"></div>

    <div class="grass"></div>

</div>


<header class="topbar">

    <div class="logo">
        DuoPlay
    </div>

    <div class="top-right">

        <div class="player-id">
            ID:
            <span id="myId">
                Connecting...
            </span>
        </div>

        <button
            class="back"
            id="backButton"
        >
            ← Game Room
        </button>

    </div>

</header>


<main class="container">

<section class="game-card">

    <div class="player-bar">

        <div class="player-icon">
            ♟
        </div>

        <div class="player-info">

            <strong id="opponentName">
                Waiting for opponent
            </strong>

            <span>
                <span class="status-dot"></span>

                <span id="connectionText">
                    Connecting...
                </span>
            </span>

        </div>

    </div>


    <div class="board-wrap">

        <div
            class="board"
            id="board"
        ></div>

    </div>

</section>


<aside class="side-panel">

    <div class="panel">

        <div class="panel-title">
            YOUR COLOR
        </div>

        <div
            class="value"
            id="colorText"
        >
            Waiting...
        </div>

    </div>


    <div class="panel">

        <div class="panel-title">
            TURN
        </div>

        <div
            class="value"
            id="turnText"
        >
            Waiting...
        </div>

    </div>


    <div class="panel">

        <div class="panel-title">
            STATUS
        </div>

        <div
            class="game-status"
            id="gameStatus"
        >
            Connecting to DuoPlay...
        </div>

    </div>


    <div class="panel">

        <div class="panel-title">
            LAST ACTION
        </div>

        <div
            class="game-status"
            id="mainStatus"
        >
            Connecting...
        </div>

    </div>


    <div class="panel">

        <div class="panel-title">
            CAPTURED BY WHITE
        </div>

        <div
            class="captured"
            id="capturedWhite"
        ></div>

    </div>


    <div class="panel">

        <div class="panel-title">
            CAPTURED BY BLACK
        </div>

        <div
            class="captured"
            id="capturedBlack"
        ></div>

    </div>


    <div class="panel">

        <div class="panel-title">
            MOVE HISTORY
        </div>

        <div
            class="history"
            id="history"
        ></div>

    </div>


    <div class="panel">

        <div class="actions">

            <button
                class="action"
                id="flipButton"
            >
                Flip
            </button>

            <button
                class="action gold"
                id="newButton"
            >
                Sync
            </button>

        </div>

    </div>

</aside>

</main>


<!-- WAITING -->

<div
    class="waiting"
    id="waiting"
>

    <div class="waiting-card">

        <div class="loader"></div>

        <h2 id="waitingTitle">
            Connecting
        </h2>

        <p id="waitingMessage">
            Connecting to DuoPlay server...
        </p>

    </div>

</div>


<!-- PROMOTION -->

<div
    class="promotion"
    id="promotion"
>

    <div class="promotion-box">

        <h2>
            Choose promotion
        </h2>

        <div class="promotion-buttons">

            <button data-piece="q">
                ♕
            </button>

            <button data-piece="r">
                ♖
            </button>

            <button data-piece="b">
                ♗
            </button>

            <button data-piece="n">
                ♘
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const SERVER =
    "https://duoplayserver.onrender.com";


/* =====================================================
   PIECES
===================================================== */

const PIECES = {

    w: {
        p: "♙",
        n: "♘",
        b: "♗",
        r: "♖",
        q: "♕",
        k: "♔"
    },

    b: {
        p: "♟",
        n: "♞",
        b: "♝",
        r: "♜",
        q: "♛",
        k: "♚"
    }

};


/* =====================================================
   VARIABLES
===================================================== */

let socket = null;

let myId =
    localStorage.getItem(
        "duoplayPlayerId"
    );

let roomId =
    localStorage.getItem(
        "duoplayRoomId"
    );

let myColor = null;

let game =
    new Chess();

let selectedSquare = null;

let legalMoves = [];

let lastMove = null;

let flipped = false;

let waitingPromotion = null;

let moveHistory = [];


/* =====================================================
   ELEMENTS
===================================================== */

const board =
    document.getElementById("board");

const myIdElement =
    document.getElementById("myId");

const connectionText =
    document.getElementById("connectionText");

const opponentName =
    document.getElementById("opponentName");

const colorText =
    document.getElementById("colorText");

const turnText =
    document.getElementById("turnText");

const mainStatus =
    document.getElementById("mainStatus");

const gameStatus =
    document.getElementById("gameStatus");

const historyElement =
    document.getElementById("history");

const capturedWhite =
    document.getElementById("capturedWhite");

const capturedBlack =
    document.getElementById("capturedBlack");

const waiting =
    document.getElementById("waiting");

const waitingTitle =
    document.getElementById("waitingTitle");

const waitingMessage =
    document.getElementById("waitingMessage");


/* =====================================================
   WAITING
===================================================== */

function showWaiting(title, message) {

    waitingTitle.textContent =
        title;

    waitingMessage.textContent =
        message;

    waiting.classList.add("show");
}


function hideWaiting() {

    waiting.classList.remove("show");

}


/* =====================================================
   CONNECT
===================================================== */

function connectToServer() {

    showWaiting(
        "Connecting",
        "Connecting to DuoPlay multiplayer server..."
    );

    socket =
        io(SERVER, {

            transports: [
                "websocket",
                "polling"
            ]

        });


    socket.on(
        "connect",
        () => {

            connectionText.textContent =
                "Connected";

            connectionText.style.color =
                "#aef5c8";

            myId =
                socket.id;

            localStorage.setItem(
                "duoplayPlayerId",
                myId
            );

            myIdElement.textContent =
                myId;

            joinExistingRoom();

        }
    );


    socket.on(
        "disconnect",
        () => {

            connectionText.textContent =
                "Disconnected";

            connectionText.style.color =
                "#ffb5a8";

        }
    );


    socket.on(
        "connect_error",
        error => {

            console.error(
                "Socket connection error:",
                error
            );

            connectionText.textContent =
                "Connection failed";

            showWaiting(
                "Connection failed",
                "Could not connect to DuoPlay server."
            );

        }
    );


    /* =================================================
       ROOM UPDATE
    ================================================= */

    socket.on(
        "room:update",
        data => {

            if (!data) {
                return;
            }

            roomId =
                data.roomId || roomId;

            const players =
                data.players || [];

            updatePlayers(
                players
            );

        }
    );


    /* =================================================
       GAME START
    ================================================= */

    socket.on(
        "game:start",
        data => {

            console.log(
                "GAME START:",
                data
            );

            roomId =
                data.roomId;

            localStorage.setItem(
                "duoplayRoomId",
                roomId
            );

            const players =
                data.players || [];

            determineColor(
                players
            );

            hideWaiting();

            mainStatus.textContent =
                "Game started.";

            gameStatus.textContent =
                "Chess game started.";

            renderBoard();

        }
    );


    /* =================================================
       CHESS MOVE
    ================================================= */

    socket.on(
        "chess:move",
        data => {

            console.log(
                "Opponent move:",
                data
            );

            if (!data.from || !data.to) {
                return;
            }

            applyOpponentMove(
                data
            );

        }
    );


    /* =================================================
       CHESS STATE
    ================================================= */

    socket.on(
        "chess:state",
        data => {

            if (!data) {
                return;
            }

            if (data.fen) {

                try {

                    game.load(
                        data.fen
                    );

                    renderBoard();

                    updateUI();

                }
                catch(error) {

                    console.error(
                        "Invalid FEN:",
                        error
                    );

                }

            }

        }
    );


    /* =================================================
       PLAYER LEFT
    ================================================= */

    socket.on(
        "room:player-left",
        () => {

            opponentName.textContent =
                "Opponent disconnected";

            mainStatus.textContent =
                "Opponent left the game.";

            gameStatus.textContent =
                "Waiting for opponent.";

        }
    );

}


/* =====================================================
   JOIN EXISTING ROOM
===================================================== */

function joinExistingRoom() {

    if (!roomId) {

        hideWaiting();

        mainStatus.textContent =
            "No game room found.";

        gameStatus.textContent =
            "Open a chess room from Game Room.";

        return;

    }


    socket.emit(
        "room:join",
        {
            roomId: roomId,
            name:
                localStorage.getItem(
                    "duoplayPlayerName"
                ) ||
                "Player"
        },
        response => {

            console.log(
                "JOIN RESPONSE:",
                response
            );

            if (!response || !response.success) {

                hideWaiting();

                mainStatus.textContent =
                    response &&
                    response.error
                        ? response.error
                        : "Could not join room.";

                return;

            }


            roomId =
                response.roomId;

            localStorage.setItem(
                "duoplayRoomId",
                roomId
            );


            updatePlayers(
                response.players || []
            );


            determineColor(
                response.players || []
            );


            if (
                response.players &&
                response.players.length === 2
            ) {

                hideWaiting();

                mainStatus.textContent =
                    "Game ready.";

                gameStatus.textContent =
                    "Your opponent is connected.";

            }
            else {

                hideWaiting();

                mainStatus.textContent =
                    "Waiting for opponent.";

                gameStatus.textContent =
                    "Share the room with another player.";

            }

            renderBoard();

            updateUI();

        }
    );

}


/* =====================================================
   PLAYERS
===================================================== */

function updatePlayers(players) {

    if (!players) {
        return;
    }


    if (players.length === 0) {

        opponentName.textContent =
            "Waiting for opponent";

        return;

    }


    const me =
        players.find(
            player =>
                player.id === myId
        );


    const opponent =
        players.find(
            player =>
                player.id !== myId
        );


    if (me) {

        myColor =
            me.color;

        colorText.textContent =
            myColor === "white"
                ? "You are White"
                : "You are Black";

        flipped =
            myColor === "black";

    }


    if (opponent) {

        opponentName.textContent =
            opponent.name ||
            "Opponent";

    }

}


/* =====================================================
   DETERMINE COLOR
===================================================== */

function determineColor(players) {

    const me =
        players.find(
            player =>
                player.id === myId
        );

    const opponent =
        players.find(
            player =>
                player.id !== myId
        );


    if (me) {

        myColor =
            me.color;

    }


    if (myColor) {

        colorText.textContent =
            myColor === "white"
                ? "You are White"
                : "You are Black";

        flipped =
            myColor === "black";

    }


    if (opponent) {

        opponentName.textContent =
            opponent.name ||
            "Opponent";

    }

}


/* =====================================================
   RENDER BOARD
===================================================== */

function renderBoard() {

    board.innerHTML = "";


    let files =
        [
            "a",
            "b",
            "c",
            "d",
            "e",
            "f",
            "g",
            "h"
        ];


    let ranks =
        [
            "8",
            "7",
            "6",
            "5",
            "4",
            "3",
            "2",
            "1"
        ];


    if (flipped) {

        files.reverse();

        ranks.reverse();

    }


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const file =
                files[col];

            const rank =
                ranks[row];

            const square =
                file + rank;


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "square " +
                (
                    (row + col) % 2 === 0
                        ? "light"
                        : "dark"
                );


            if (
                selectedSquare === square
            ) {

                element.classList.add(
                    "selected"
                );

            }


            if (
                lastMove &&
                (
                    lastMove.from === square ||
                    lastMove.to === square
                )
            ) {

                element.classList.add(
                    "last"
                );

            }


            const target =
                legalMoves.find(
                    move =>
                        move.to === square
                );


            if (target) {

                if (
                    target.captured ||
                    target.flags.includes("c")
                ) {

                    element.classList.add(
                        "capture-target"
                    );

                }
                else {

                    element.classList.add(
                        "move-target"
                    );

                }

            }


            const piece =
                game.get(square);


            if (piece) {

                const pieceElement =
                    document.createElement(
                        "span"
                    );

                pieceElement.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white"
                            : "black"
                    );

                pieceElement.textContent =
                    PIECES[
                        piece.color
                    ][
                        piece.type
                    ];

                element.appendChild(
                    pieceElement
                );

            }


            element.addEventListener(
                "click",
                () => {

                    squareClicked(
                        square
                    );

                }
            );


            board.appendChild(
                element
            );

        }

    }


    updateUI();

    updateCaptured();

    updateHistory();

}


/* =====================================================
   CLICK SQUARE
===================================================== */

function squareClicked(square) {

    if (!roomId) {

        mainStatus.textContent =
            "No game room.";

        return;

    }


    if (!myColor) {

        mainStatus.textContent =
            "Your color is not ready.";

        return;

    }


    if (game.isGameOver()) {

        return;

    }


    const turn =
        game.turn();


    const myTurn =
        (
            myColor === "white" &&
            turn === "w"
        )
        ||
        (
            myColor === "black" &&
            turn === "b"
        );


    if (!myTurn) {

        mainStatus.textContent =
            "Wait for your turn.";

        return;

    }


    if (selectedSquare) {

        const target =
            legalMoves.find(
                move =>
                    move.to === square
            );


        if (target) {

            if (
                target.flags.includes("p")
            ) {

                waitingPromotion = {

                    from:
                        selectedSquare,

                    to:
                        square

                };

                showPromotion();

            }
            else {

                sendMove(
                    selectedSquare,
                    square
                );

            }

            return;

        }


        const piece =
            game.get(square);


        if (
            piece &&
            piece.color === turn
        ) {

            selectSquare(
                square
            );

        }
        else {

            clearSelection();

        }


        renderBoard();

        return;

    }


    const piece =
        game.get(square);


    if (
        piece &&
        piece.color === turn
    ) {

        selectSquare(
            square
        );

    }

}


/* =====================================================
   SELECT
===================================================== */

function selectSquare(square) {

    selectedSquare =
        square;

    legalMoves =
        game.moves({

            square:
                square,

            verbose:
                true

        });

    renderBoard();

}


/* =====================================================
   CLEAR
===================================================== */

function clearSelection() {

    selectedSquare =
        null;

    legalMoves =
        [];

}


/* =====================================================
   SEND MOVE
===================================================== */

function sendMove(
    from,
    to,
    promotion = "q"
) {

    if (
        !socket ||
        !socket.connected
    ) {

        mainStatus.textContent =
            "Not connected to server.";

        return;

    }


    const movingPiece =
        game.get(from);


    if (!movingPiece) {
        return;
    }


    let move;


    try {

        move =
            game.move({

                from:
                    from,

                to:
                    to,

                promotion:
                    promotion

            });

    }
    catch(error) {

        console.error(
            "Move error:",
            error
        );

        return;

    }


    if (!move) {

        return;

    }


    lastMove = {

        from:
            from,

        to:
            to

    };


    moveHistory.push(
        move.san
    );


    socket.emit(
        "chess:move",
        {

            from:
                from,

            to:
                to,

            promotion:
                promotion,

            fen:
                game.fen(),

            san:
                move.san

        }
    );


    socket.emit(
        "chess:state",
        {

            fen:
                game.fen()

        }
    );


    clearSelection();


    mainStatus.textContent =
        "Move sent.";

    updateGameStatus();

    renderBoard();

}


/* =====================================================
   APPLY OPPONENT MOVE
===================================================== */

function applyOpponentMove(data) {

    try {

        const move =
            game.move({

                from:
                    data.from,

                to:
                    data.to,

                promotion:
                    data.promotion ||
                    "q"

            });


        if (!move) {

            if (data.fen) {

                game.load(
                    data.fen
                );

            }

            renderBoard();

            updateUI();

            return;

        }


        lastMove = {

            from:
                data.from,

            to:
                data.to

        };


        moveHistory.push(
            move.san
        );


        clearSelection();


        mainStatus.textContent =
            "Opponent moved.";


        updateGameStatus();

        renderBoard();

    }
    catch(error) {

        console.error(
            "Could not apply opponent move:",
            error
        );


        if (data.fen) {

            try {

                game.load(
                    data.fen
                );

            }
            catch(e) {

                console.error(e);

            }

        }


        renderBoard();

    }

}


/* =====================================================
   PROMOTION
===================================================== */

function showPromotion() {

    document
        .getElementById("promotion")
        .classList.add("show");

}


function hidePromotion() {

    document
        .getElementById("promotion")
        .classList.remove("show");

}


document
    .querySelectorAll(
        ".promotion-buttons button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (
                        !waitingPromotion
                    ) {

                        return;

                    }


                    const piece =
                        button.dataset.piece;


                    sendMove(

                        waitingPromotion.from,

                        waitingPromotion.to,

                        piece

                    );


                    waitingPromotion =
                        null;


                    hidePromotion();

                }
            );

        }
    );


/* =====================================================
   UI
===================================================== */

function updateUI() {

    const turn =
        game.turn();


    const turnName =
        turn === "w"
            ? "White"
            : "Black";


    turnText.textContent =
        turnName +
        " to move";


    if (!roomId) {

        mainStatus.textContent =
            "Waiting for game room.";

        return;

    }


    if (
        !myColor
    ) {

        return;

    }


    const myTurn =
        (
            myColor === "white" &&
            turn === "w"
        )
        ||
        (
            myColor === "black" &&
            turn === "b"
        );


    if (myTurn) {

        mainStatus.textContent =
            "Your turn";

    }
    else {

        mainStatus.textContent =
            "Opponent's turn";

    }


    updateGameStatus();

}


/* =====================================================
   GAME STATUS
===================================================== */

function updateGameStatus() {

    if (
        game.isCheckmate()
    ) {

        const winner =
            game.turn() === "w"
                ? "Black"
                : "White";

        gameStatus.textContent =
            winner +
            " wins by checkmate.";

        return;

    }


    if (
        game.isDraw()
    ) {

        gameStatus.textContent =
            "Game drawn.";

        return;

    }


    if (
        game.isCheck()
    ) {

        gameStatus.textContent =
            game.turn() === "w"
                ? "White is in check."
                : "Black is in check.";

        return;

    }


    gameStatus.textContent =
        "Chess game in progress.";

}


/* =====================================================
   CAPTURED PIECES
===================================================== */

function updateCaptured() {

    capturedWhite.innerHTML = "";

    capturedBlack.innerHTML = "";


    const original = {

        p: 8,
        n: 2,
        b: 2,
        r: 2,
        q: 1,
        k: 1

    };


    const current = {

        w: {
            p: 0,
            n: 0,
            b: 0,
            r: 0,
            q: 0,
            k: 0
        },

        b: {
            p: 0,
            n: 0,
            b: 0,
            r: 0,
            q: 0,
            k: 0
        }

    };


    game.board().forEach(
        row => {

            row.forEach(
                piece => {

                    if (piece) {

                        current[
                            piece.color
                        ][
                            piece.type
                        ]++;

                    }

                }
            );

        }
    );


    const types = [
        "q",
        "r",
        "b",
        "n",
        "p"
    ];


    types.forEach(
        type => {

            const count =
                original[type] -
                current.b[type];


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    PIECES.b[type];

                capturedWhite.appendChild(
                    span
                );

            }

        }
    );


    types.forEach(
        type => {

            const count =
                original[type] -
                current.w[type];


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    PIECES.w[type];

                capturedBlack.appendChild(
                    span
                );

            }

        }
    );

}


/* =====================================================
   HISTORY
===================================================== */

function updateHistory() {

    historyElement.innerHTML = "";


    for (
        let i = 0;
        i < moveHistory.length;
        i++
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "history-row";


        const number =
            document.createElement(
                "span"
            );

        number.className =
            "history-number";


        number.textContent =
            Math.floor(i / 2) + 1 +
            (
                i % 2 === 0
                    ? "."
                    : "..."
            );


        const move =
            document.createElement(
                "span"
            );

        move.textContent =
            moveHistory[i];


        row.appendChild(
            number
        );

        row.appendChild(
            move
        );


        historyElement.appendChild(
            row
        );

    }


    historyElement.scrollTop =
        historyElement.scrollHeight;

}


/* =====================================================
   FLIP
===================================================== */

document
    .getElementById(
        "flipButton"
    )
    .addEventListener(
        "click",
        () => {

            flipped =
                !flipped;

            renderBoard();

        }
    );


/* =====================================================
   SYNC
===================================================== */

document
    .getElementById(
        "newButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                socket &&
                socket.connected &&
                roomId
            ) {

                socket.emit(
                    "chess:state",
                    {

                        fen:
                            game.fen()

                    }
                );

                mainStatus.textContent =
                    "Game synchronized.";

            }

        }
    );


/* =====================================================
   BACK
===================================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                socket &&
                socket.connected
            ) {

                socket.emit(
                    "room:leave"
                );

            }


            window.location.href =
                "games.html";

        }
    );


/* =====================================================
   START
===================================================== */

renderBoard();

connectToServer();

</script>
