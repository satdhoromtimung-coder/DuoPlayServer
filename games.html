<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuoPlay — Game Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            180deg,
            #79c9c5 0%,
            #a8ddd0 35%,
            #709b70 67%,
            #153d2c 100%
        );
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;
}

.sun {
    position: absolute;

    width: 140px;
    height: 140px;

    top: 6%;
    right: 9%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffde3,
            #ffe8a0 55%,
            #ffd36d
        );

    box-shadow:
        0 0 55px #ffe8a0;
}

.cloud {
    position: absolute;

    width: 180px;
    height: 42px;

    border-radius: 50px;

    background: rgba(255,255,255,.35);

    animation:
        cloudMove 45s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,.38);
}

.cloud::before {
    width: 75px;
    height: 75px;

    left: 25px;
    bottom: 0;
}

.cloud::after {
    width: 60px;
    height: 60px;

    right: 25px;
    bottom: 0;
}

.cloud.one {
    top: 15%;
    left: -220px;
}

.cloud.two {
    top: 30%;
    left: -300px;

    transform: scale(.7);

    animation-duration: 60s;
    animation-delay: -20s;
}

@keyframes cloudMove {

    from {
        transform: translateX(0);
    }

    to {
        transform:
            translateX(
                calc(100vw + 500px)
            );
    }
}

/* =========================
   MOUNTAINS
========================= */

.mountains {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 22%;

    height: 45%;
}

.mountain {
    position: absolute;

    bottom: 0;

    width: 0;
    height: 0;

    border-left: 230px solid transparent;
    border-right: 230px solid transparent;

    border-bottom: 350px solid #628a80;
}

.mountain.one {
    left: -170px;
}

.mountain.two {
    left: 18%;

    transform: scale(.8);
}

.mountain.three {
    left: 43%;

    transform: scale(1.15);

    border-bottom-color: #547b71;
}

.mountain.four {
    left: 72%;

    transform: scale(.8);
}

.ground {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 22%;

    background:
        linear-gradient(
            to top,
            #153d2c,
            rgba(35,100,67,.72)
        );
}

/* =========================
   HEADER
========================= */

header {
    min-height: 72px;

    padding: 12px 24px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background:
        rgba(8,47,37,.15);

    border-bottom:
        1px solid rgba(255,255,255,.12);
}

.logo {
    font-family: Georgia, serif;

    font-size: 34px;
    font-weight: bold;

    color: #ffe19a;

    text-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

.connection {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px 16px;

    border-radius: 25px;

    background:
        rgba(10,48,38,.60);

    border:
        1px solid rgba(255,255,255,.15);

    font-size: 14px;
}

.status-dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #f0b45b;
}

.status-dot.connected {
    background: #5ff09b;

    box-shadow:
        0 0 10px #5ff09b;
}

.status-dot.error {
    background: #ff7777;

    box-shadow:
        0 0 10px #ff7777;
}

/* =========================
   MAIN
========================= */

main {
    width: min(1000px, 94%);

    margin:
        45px auto 60px;

    text-align: center;
}

.title {
    margin: 0;

    font-family: Georgia, serif;

    font-size:
        clamp(42px, 7vw, 70px);

    color: #fff1c3;

    text-shadow:
        0 5px 20px rgba(0,0,0,.22);
}

.subtitle {
    margin:
        8px 0 35px;

    color: #e1f1eb;

    font-size: 17px;
}

/* =========================
   CHESS CARD
========================= */

.games {
    display: flex;

    justify-content: center;
}

.game-card {
    width: 350px;

    min-height: 390px;

    padding: 28px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    border-radius: 28px;

    background:
        rgba(8,47,37,.80);

    border:
        1px solid rgba(255,255,255,.16);

    box-shadow:
        0 25px 60px rgba(0,0,0,.28);

    backdrop-filter:
        blur(6px);
}

.chess-icon {
    height: 150px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Times New Roman",
        serif;

    font-size: 125px;

    color: #fff7e5;

    text-shadow:
        0 7px 5px rgba(0,0,0,.60);
}

.game-name {
    margin-top: 5px;

    font-size: 30px;

    font-weight: bold;

    color: #ffe7a2;
}

.game-description {
    margin-top: 10px;

    color: #cce4dc;

    line-height: 1.5;

    font-size: 16px;
}

.play-button {
    width: 100%;

    margin-top: 23px;

    padding: 15px;

    border: 0;

    border-radius: 15px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #f7d987,
            #dca84f
        );

    color: #2c210f;

    font-size: 17px;

    font-weight: bold;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.play-button:hover {
    transform:
        translateY(-2px);

    filter:
        brightness(1.08);
}

.play-button:disabled {
    cursor: not-allowed;

    opacity: .65;

    transform: none;
}

/* =========================
   PLAYERS ONLINE
========================= */

.players-section {
    width:
        min(650px,100%);

    margin:
        35px auto 0;

    padding: 25px;

    border-radius: 22px;

    background:
        rgba(8,47,37,.72);

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:
        blur(5px);
}

.section-title {
    color: #ffe5a0;

    font-family: monospace;

    letter-spacing: 2px;

    font-size: 13px;

    margin-bottom: 12px;
}

.online-number {
    font-family: Georgia, serif;

    font-size: 45px;

    font-weight: bold;

    color: #fff1c3;
}

.online-text {
    margin-top: 3px;

    color: #cce4dc;

    font-size: 15px;
}

.connection-message {
    margin-top: 15px;

    color: #dcece6;

    font-size: 14px;
}

/* =========================
   WAITING OVERLAY
========================= */

.waiting {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(8px);
}

.waiting.show {
    display: flex;
}

.waiting-box {
    width:
        min(390px,100%);

    padding: 35px 25px;

    border-radius: 25px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #164b3c,
            #082e24
        );

    border:
        1px solid rgba(255,255,255,.16);

    box-shadow:
        0 30px 90px rgba(0,0,0,.5);
}

.waiting-icon {
    font-size: 55px;

    margin-bottom: 12px;
}

.waiting-box h2 {
    margin: 5px 0 10px;

    color: #ffe4a0;
}

.waiting-box p {
    margin: 0;

    color: #c9dfd7;

    line-height: 1.5;
}

.loader {
    width: 48px;
    height: 48px;

    margin:
        0 auto 20px;

    border-radius: 50%;

    border:
        4px solid rgba(255,255,255,.14);

    border-top-color:
        #f1cf78;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {
        padding:
            10px 14px;
    }

    .logo {
        font-size: 27px;
    }

    .connection {
        padding:
            8px 11px;

        font-size: 11px;
    }

    main {
        margin-top: 25px;
    }

    .title {
        font-size: 45px;
    }

    .subtitle {
        font-size: 15px;

        margin-bottom: 25px;
    }

    .game-card {
        width:
            min(350px,94vw);
    }

    .chess-icon {
        font-size: 110px;
    }

    .players-section {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="mountains">

        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>
        <div class="mountain four"></div>

    </div>

    <div class="ground"></div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        DuoPlay
    </div>

    <div class="connection">

        <span
            id="statusDot"
            class="status-dot"
        ></span>

        <span id="connectionText">
            Connecting...
        </span>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <h1 class="title">
        Game Room
    </h1>

    <p class="subtitle">
        Challenge another player and play together.
    </p>


    <!-- CHESS ONLY -->

    <div class="games">

        <div class="game-card">

            <div class="chess-icon">
                ♞
            </div>

            <div class="game-name">
                Chess
            </div>

            <div class="game-description">
                Connect with another player
                and play an online chess match.
            </div>

            <button
                id="playChess"
                class="play-button"
                disabled
            >
                CONNECT & PLAY CHESS
            </button>

        </div>

    </div>


    <!-- =========================
         PLAYERS ONLINE
    ========================= -->

    <section class="players-section">

        <div class="section-title">
            PLAYERS ONLINE
        </div>

        <div
            id="onlineNumber"
            class="online-number"
        >
            0
        </div>

        <div class="online-text">
            Players currently online
        </div>

        <div
            id="connectionMessage"
            class="connection-message"
        >
            Connecting to DuoPlay...
        </div>

    </section>

</main>


<!-- =========================
     WAITING
========================= -->

<div
    id="waiting"
    class="waiting"
>

    <div class="waiting-box">

        <div class="loader"></div>

        <div class="waiting-icon">
            ♟
        </div>

        <h2 id="waitingTitle">
            Finding Opponent
        </h2>

        <p id="waitingMessage">
            Waiting for another player to join...
        </p>

    </div>

</div>


<script>

/* =====================================================
   DUOPLAY SERVER
===================================================== */

/*
   This page is served by the same Render server.

   Therefore:
   window.location.origin

   automatically becomes:

   https://duoplayserver.onrender.com
*/

const SERVER =
    window.location.origin;


/* =====================================================
   ELEMENTS
===================================================== */

const statusDot =
    document.getElementById(
        "statusDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const onlineNumber =
    document.getElementById(
        "onlineNumber"
    );

const connectionMessage =
    document.getElementById(
        "connectionMessage"
    );

const playChess =
    document.getElementById(
        "playChess"
    );

const waiting =
    document.getElementById(
        "waiting"
    );

const waitingTitle =
    document.getElementById(
        "waitingTitle"
    );

const waitingMessage =
    document.getElementById(
        "waitingMessage"
    );


/* =====================================================
   PLAYER ID
===================================================== */

let myPlayerId =
    localStorage.getItem(
        "duoplayPlayerId"
    );


/* =====================================================
   SOCKET.IO
===================================================== */

const socket =
    io(
        SERVER,
        {
            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts: Infinity
        }
    );


/* =====================================================
   CONNECTED
===================================================== */

socket.on(
    "connect",
    () => {

        console.log(
            "Connected to DuoPlay:",
            socket.id
        );

        statusDot.className =
            "status-dot connected";

        connectionText.textContent =
            "Connected";

        connectionMessage.textContent =
            "Connected to DuoPlay.";

        playChess.disabled =
            false;

        /*
         * The server sends the permanent
         * DuoPlay player ID.
         */

        /*
         * Do not automatically start a game.
         *
         * Player presses:
         * CONNECT & PLAY CHESS
         */

        updateOnlinePlayers();

    }
);


/* =====================================================
   PLAYER ID FROM SERVER
===================================================== */

socket.on(
    "yourId",
    (id) => {

        if (!id) {
            return;
        }

        myPlayerId =
            id;

        localStorage.setItem(
            "duoplayPlayerId",
            id
        );

        console.log(
            "DuoPlay Player ID:",
            id
        );

    }
);


/* =====================================================
   CONNECTION ERROR
===================================================== */

socket.on(
    "connect_error",
    (error) => {

        console.error(
            "DuoPlay connection error:",
            error
        );

        statusDot.className =
            "status-dot error";

        connectionText.textContent =
            "Connection failed";

        connectionMessage.textContent =
            "Cannot connect to DuoPlay server.";

        playChess.disabled =
            true;

    }
);


/* =====================================================
   DISCONNECTED
===================================================== */

socket.on(
    "disconnect",
    (reason) => {

        console.log(
            "Disconnected:",
            reason
        );

        statusDot.className =
            "status-dot";

        connectionText.textContent =
            "Disconnected";

        connectionMessage.textContent =
            "Connection lost. Reconnecting...";

        playChess.disabled =
            true;

    }
);


/* =====================================================
   ONLINE PLAYER COUNT
===================================================== */

async function updateOnlinePlayers() {

    try {

        const response =
            await fetch(
                SERVER + "/health",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (
            typeof data.players ===
            "number"
        ) {

            onlineNumber.textContent =
                data.players;

        }

    }
    catch (error) {

        console.error(
            "Online count error:",
            error
        );

    }

}


/* =====================================================
   UPDATE ONLINE COUNT
===================================================== */

setInterval(
    updateOnlinePlayers,
    3000
);


/* =====================================================
   PLAY CHESS
===================================================== */

playChess.onclick =
    () => {

        if (!socket.connected) {

            alert(
                "DuoPlay is not connected yet."
            );

            return;

        }

        /*
         * Prevent double clicking.
         */

        playChess.disabled =
            true;


        /*
         * Show waiting screen.
         */

        waitingTitle.textContent =
            "Finding Opponent";

        waitingMessage.textContent =
            "Waiting for another player...";

        waiting.classList.add(
            "show"
        );


        /*
         * IMPORTANT:
         *
         * Your current server.js listens
         * for "getGameState".
         *
         * The server then calls joinChess()
         * and places two players together.
         */

        socket.emit(
            "getGameState"
        );

    };


/* =====================================================
   CHESS GAME READY
===================================================== */

socket.on(
    "gameReady",
    (data) => {

        console.log(
            "CHESS GAME READY:",
            data
        );

        if (!data) {
            return;
        }


        /*
         * Save game information.
         */

        if (data.roomId) {

            localStorage.setItem(
                "duoplayRoomId",
                data.roomId
            );

        }

        localStorage.setItem(
            "duoplayGame",
            JSON.stringify(data)
        );


        /*
         * Save player ID.
         */

        if (myPlayerId) {

            localStorage.setItem(
                "duoplayPlayerId",
                myPlayerId
            );

        }


        /*
         * Tell user what is happening.
         */

        waitingTitle.textContent =
            "Chess Ready";

        waitingMessage.textContent =
            "Opening your chess game...";


        /*
         * Open chess page.
         */

        setTimeout(
            () => {

                window.location.href =
                    "/chess.html";

            },
            400
        );

    }
);


/* =====================================================
   CHESS WAITING
===================================================== */

socket.on(
    "chessWaiting",
    () => {

        console.log(
            "Waiting for chess opponent..."
        );

        waitingTitle.textContent =
            "Finding Opponent";

        waitingMessage.textContent =
            "You are connected. Waiting for another player to join...";

    }
);


/* =====================================================
   RECONNECTED GAME
===================================================== */

socket.on(
    "gameReconnected",
    (data) => {

        console.log(
            "Chess game reconnected:",
            data
        );

        if (!data) {
            return;
        }

        if (data.roomId) {

            localStorage.setItem(
                "duoplayRoomId",
                data.roomId
            );

        }

        localStorage.setItem(
            "duoplayGame",
            JSON.stringify(data)
        );

        window.location.href =
            "/chess.html";

    }
);


/* =====================================================
   CURRENT GAME STATE
===================================================== */

socket.on(
    "gameState",
    (data) => {

        console.log(
            "Chess game state:",
            data
        );

        if (!data) {
            return;
        }

        if (data.roomId) {

            localStorage.setItem(
                "duoplayRoomId",
                data.roomId
            );

        }

        localStorage.setItem(
            "duoplayGame",
            JSON.stringify(data)
        );

    }
);


/* =====================================================
   INITIAL ONLINE COUNT
===================================================== */

updateOnlinePlayers();

</script>

</body>
</html>
