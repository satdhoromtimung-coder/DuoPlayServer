<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DuoPlay — Lobby</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="mountains"></div>

<div class="page">
  <div class="topbar">
    <a href="index.html" class="brand"><span class="brand-dot"></span>DuoPlay</a>
    <div class="player-chip">
      <span class="status-dot" id="connectionDot"></span>
      <span>You are <strong id="myPlayerId">connecting…</strong></span>
    </div>
  </div>

  <div class="lobby-wrap">
    <div class="glass-panel lobby-panel">
      <h2>Online Players</h2>
      <div class="lobby-sub" id="onlineCountLabel">Connecting to server…</div>
      <div class="player-list" id="playerList">
        <div class="empty-note">Connecting…</div>
      </div>
    </div>
  </div>

  <footer class="foot">DuoPlay · Real-time multiplayer chess</footer>
</div>

<!-- Incoming challenge popup -->
<div class="overlay hidden" id="challengeOverlay">
  <div class="glass-panel challenge-card">
    <div>Incoming Challenge</div>
    <div class="from-id" id="challengeFromId">DP-000000</div>
    <p>wants to play Chess with you.</p>
    <div class="challenge-actions">
      <button class="btn btn-danger" id="declineBtn">DECLINE</button>
      <button class="btn btn-primary" id="acceptBtn">ACCEPT</button>
    </div>
  </div>
</div>

<!-- Outgoing challenge waiting popup -->
<div class="overlay hidden" id="waitingOverlay">
  <div class="glass-panel challenge-card">
    <div>Challenge Sent</div>
    <div class="from-id" id="waitingToId">DP-000000</div>
    <p>Waiting for a response…</p>
    <div class="challenge-actions">
      <button class="btn btn-secondary" id="cancelWaitBtn" style="width:100%">CANCEL</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
/* ==========================================================================
   DuoPlay — Lobby logic (games.html)
   ========================================================================== */

const SERVER_URL = "https://duoplayserver.onrender.com";
const PLAYER_ID_KEY = "duoplay_player_id";
const CURRENT_GAME_KEY = "duoplay_current_game";

const myPlayerIdEl = document.getElementById("myPlayerId");
const connectionDot = document.getElementById("connectionDot");
const onlineCountLabel = document.getElementById("onlineCountLabel");
const playerListEl = document.getElementById("playerList");
const toastEl = document.getElementById("toast");

const challengeOverlay = document.getElementById("challengeOverlay");
const challengeFromId = document.getElementById("challengeFromId");
const acceptBtn = document.getElementById("acceptBtn");
const declineBtn = document.getElementById("declineBtn");

const waitingOverlay = document.getElementById("waitingOverlay");
const waitingToId = document.getElementById("waitingToId");
const cancelWaitBtn = document.getElementById("cancelWaitBtn");

let myPlayerId = localStorage.getItem(PLAYER_ID_KEY) || null;
let pendingIncomingFrom = null; // playerId who challenged us
let pendingOutgoingTo = null;   // playerId we challenged

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2600);
}

const socket = io(SERVER_URL, {
  transports: ["websocket", "polling"]
});

socket.on("connect", () => {
  connectionDot.classList.remove("offline");
  socket.emit("register-player", { playerId: myPlayerId });
});

socket.on("disconnect", () => {
  connectionDot.classList.add("offline");
  onlineCountLabel.textContent = "Reconnecting to server…";
});

socket.on("connect_error", () => {
  connectionDot.classList.add("offline");
  onlineCountLabel.textContent = "Unable to reach the DuoPlay server.";
});

// Server confirms / assigns our permanent player ID
socket.on("player-registered", (data) => {
  myPlayerId = data.playerId;
  localStorage.setItem(PLAYER_ID_KEY, myPlayerId);
  myPlayerIdEl.textContent = myPlayerId;

  // If we already have an active chess game saved, jump back into it
  const savedGame = localStorage.getItem(CURRENT_GAME_KEY);
  if (savedGame) {
    window.location.href = "chess.html";
  }
});

// Server tells us we have an active game waiting (e.g. after reconnect,
// even without local game data — keeps identity/game in sync with server)
socket.on("active-game-found", (data) => {
  localStorage.setItem(CURRENT_GAME_KEY, JSON.stringify(data));
  window.location.href = "chess.html";
});

// Full online player list broadcast
socket.on("players-online", (players) => {
  renderPlayerList(players);
});

function renderPlayerList(players) {
  const others = players.filter(p => p.id !== myPlayerId);
  const self = players.find(p => p.id === myPlayerId);

  onlineCountLabel.textContent = `${players.length} player${players.length === 1 ? "" : "s"} online`;

  playerListEl.innerHTML = "";

  if (self) {
    playerListEl.appendChild(buildPlayerRow(self, true));
  }

  if (others.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-note";
    empty.textContent = "No other players online right now. Share DuoPlay with a friend!";
    playerListEl.appendChild(empty);
    return;
  }

  others.forEach(p => playerListEl.appendChild(buildPlayerRow(p, false)));
}

function buildPlayerRow(player, isYou) {
  const row = document.createElement("div");
  row.className = "player-row" + (isYou ? " is-you" : "");

  const left = document.createElement("div");
  left.className = "pid-block";

  const pid = document.createElement("span");
  pid.className = "pid";
  pid.textContent = player.id;
  left.appendChild(pid);

  if (isYou) {
    const tag = document.createElement("span");
    tag.className = "you-tag";
    tag.textContent = "YOU";
    left.appendChild(tag);
  }

  row.appendChild(left);

  if (!isYou) {
    const playBtn = document.createElement("button");
    playBtn.className = "btn btn-play";
    playBtn.textContent = "PLAY";
    playBtn.disabled = player.inGame === true;
    if (player.inGame) playBtn.textContent = "IN GAME";
    playBtn.addEventListener("click", () => sendChallenge(player.id));
    row.appendChild(playBtn);
  }

  return row;
}

function sendChallenge(targetId) {
  if (targetId === myPlayerId) return;
  pendingOutgoingTo = targetId;
  waitingToId.textContent = targetId;
  waitingOverlay.classList.remove("hidden");
  socket.emit("challenge-player", { targetId });
}

cancelWaitBtn.addEventListener("click", () => {
  if (pendingOutgoingTo) {
    socket.emit("cancel-challenge", { targetId: pendingOutgoingTo });
  }
  waitingOverlay.classList.add("hidden");
  pendingOutgoingTo = null;
});

// Incoming challenge
socket.on("chess-challenge", (data) => {
  pendingIncomingFrom = data.fromId;
  challengeFromId.textContent = data.fromId;
  challengeOverlay.classList.remove("hidden");
});

acceptBtn.addEventListener("click", () => {
  if (!pendingIncomingFrom) return;
  socket.emit("accept-challenge", { fromId: pendingIncomingFrom });
  challengeOverlay.classList.add("hidden");
  pendingIncomingFrom = null;
});

declineBtn.addEventListener("click", () => {
  if (!pendingIncomingFrom) return;
  socket.emit("reject-challenge", { fromId: pendingIncomingFrom });
  challengeOverlay.classList.add("hidden");
  pendingIncomingFrom = null;
});

// Our own outgoing challenge was declined
socket.on("challenge-declined", (data) => {
  if (pendingOutgoingTo === data.byId) {
    waitingOverlay.classList.add("hidden");
    pendingOutgoingTo = null;
    showToast(`${data.byId} declined your challenge.`);
  }
});

// Challenge could not be delivered (offline, already in game, etc.)
socket.on("chess-game-error", (data) => {
  waitingOverlay.classList.add("hidden");
  pendingOutgoingTo = null;
  showToast(data.message || "Challenge could not be sent.");
});

// A real chess game has been created for us — go to the board
socket.on("chess-game-start", (data) => {
  localStorage.setItem(CURRENT_GAME_KEY, JSON.stringify({
    gameId: data.gameId,
    playerId: data.playerId,
    opponentId: data.opponentId,
    color: data.color
  }));
  window.location.href = "chess.html";
});
</script>
</body>
</html>
