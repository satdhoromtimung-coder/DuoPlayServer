<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DuoPlay - Games</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #9ca3af;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .title p {
            color: #9ca3af;
            font-size: 17px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            transition: 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }

        .game-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .game-card h2 {
            margin-bottom: 10px;
        }

        .game-card p {
            color: #9ca3af;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .coming-soon {
            background: #374151;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            background: #374151;
        }

        .online {
            margin-top: 40px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .online-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .online-text {
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .title h1 {
                font-size: 32px;
            }

            main {
                padding-top: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🎮 DuoPlay</div>

    <div class="status">
        <span class="dot"></span>
        <span id="connectionStatus">Connecting...</span>
    </div>
</header>

<main>

    <div class="title">
        <h1>Choose a Game</h1>
        <p>Play multiplayer games with other players.</p>
    </div>

    <div class="games">

        <div class="game-card">

            <div class="game-icon">♟️</div>

            <h2>Chess</h2>

            <p>
                Challenge another player
                to an online chess match.
            </p>

            <button onclick="openChess()">
                Play Chess
            </button>

        </div>


        <div class="game-card">

            <div class="game-icon">🎲</div>

            <h2>Ludo</h2>

            <p>
                Multiplayer Ludo is coming soon.
            </p>

            <button class="coming-soon" disabled>
                Coming Soon
            </button>

        </div>


        <div class="game-card">

            <div class="game-icon">🎮</div>

            <h2>More Games</h2>

            <p>
                More multiplayer games
                will be added to DuoPlay.
            </p>

            <button class="coming-soon" disabled>
                Coming Soon
            </button>

        </div>

    </div>


    <div class="online">

        <div class="online-number" id="onlineCount">
            0
        </div>

        <div class="online-text">
            Players currently online
        </div>

    </div>

</main>


<script>

    const socket = io();

    const connectionStatus =
        document.getElementById("connectionStatus");

    const onlineCount =
        document.getElementById("onlineCount");


    socket.on("connect", () => {

        connectionStatus.textContent = "Connected";

    });


    socket.on("disconnect", () => {

        connectionStatus.textContent = "Disconnected";

    });


    socket.on("onlineUsers", (count) => {

        onlineCount.textContent = count;

    });


    function openChess() {

        window.location.href = "/chess.html";

    }

</script>

</body>
</html>
