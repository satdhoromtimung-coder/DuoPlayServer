<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DuoPlay - Chess</title>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff8dc;

            background:
                linear-gradient(
                    180deg,
                    #a7ded5 0%,
                    #91c6b5 45%,
                    #68947e 72%,
                    #255b45 100%
                );

            position: relative;
        }

        /* =========================
           MOUNTAINS
        ========================= */

        .mountains {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .mountain {
            position: absolute;
            bottom: 20%;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-bottom: 290px solid rgba(65, 104, 96, 0.55);
        }

        .mountain.one {
            left: -110px;
        }

        .mountain.two {
            left: 19%;
            bottom: 16%;
            border-left-width: 220px;
            border-right-width: 220px;
            border-bottom-width: 370px;
            opacity: 0.55;
        }

        .mountain.three {
            right: -100px;
            bottom: 17%;
            border-left-width: 190px;
            border-right-width: 190px;
            border-bottom-width: 320px;
            opacity: 0.55;
        }

        .ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 27%;
            background:
                linear-gradient(
                    180deg,
                    rgba(50, 103, 72, 0.58),
                    rgba(17, 70, 49, 0.88)
                );
        }

        /* =========================
           MAIN
        ========================= */

        .page {
            position: relative;
            z-index: 2;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 22px 20px 35px;
        }

        /* =========================
           DUOPLAY LOGO
        ========================= */

        .logo {
            position: fixed;
            top: 6px;
            left: 10px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 42px;
            font-weight: 900;

            color: #ffe39a;

            text-shadow:
                0 3px 5px rgba(0, 0, 0, 0.28);

            z-index: 10;
        }

        /* =========================
           CHESS CARD
        ========================= */

        .chess-card {
            width: min(390px, 92vw);

            margin-top: 0;

            padding: 42px 30px 36px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(29, 83, 69, 0.97),
                    rgba(13, 65, 52, 0.97)
                );

            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            text-align: center;
        }

        /* =========================
           CHESS ICON
        ========================= */

        .chess-icon {
            height: 125px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 5px;
        }

        .knight {
            font-family: Georgia, serif;

            font-size: 108px;
            line-height: 1;

            color: #fff8dc;

            filter:
                drop-shadow(
                    0 7px 5px rgba(0, 0, 0, 0.3)
                );
        }

        /* =========================
           TITLE
        ========================= */

        h1 {
            margin: 7px 0 10px;

            font-size: 34px;
            font-weight: 800;

            color: #ffe39a;
        }

        .subtitle {
            margin: 0 auto 25px;

            max-width: 310px;

            font-size: 20px;
            line-height: 1.35;

            color: rgba(255, 255, 255, 0.78);
        }

        /* =========================
           PLAY BUTTON
        ========================= */

        .play-button {
            width: 100%;

            border: none;
            border-radius: 18px;

            padding: 17px 20px;

            background:
                linear-gradient(
                    135deg,
                    #ffe58f,
                    #f5b94f
                );

            color: #17251f;

            font-size: 21px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                opacity 0.15s ease;
        }

        .play-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.22);
        }

        .play-button:active {
            transform: translateY(1px);
        }

        .play-button:disabled {
            cursor: wait;
            opacity: 0.75;
            transform: none;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            margin-top: 18px;

            min-height: 24px;

            font-size: 15px;
            font-weight: 600;

            color: rgba(255, 255, 255, 0.82);
        }

        .status.waiting {
            color: #ffe39a;
        }

        .status.error {
            color: #ffb4a8;
        }

        /* =========================
           PLAYERS ONLINE
        ========================= */

        .online-card {
            width: min(820px, 92vw);

            margin-top: 44px;

            padding: 31px 25px 42px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(16, 67, 53, 0.96),
                    rgba(7, 58, 45, 0.96)
                );

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            text-align: center;
        }

        .online-title {
            margin-bottom: 34px;

            font-family: monospace;
            font-size: 16px;
            font-weight: 700;

            letter-spacing: 5px;

            color: #ffe39a;
        }

        .online-count {
            margin: 0;

            font-size: 22px;

            color: rgba(255, 255, 255, 0.78);
        }

        .online-number {
            display: block;

            margin-bottom: 6px;

            font-size: 28px;
            font-weight: 800;

            color: #fff8dc;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                position: relative;
                top: auto;
                left: auto;

                align-self: flex-start;

                margin-bottom: 20px;

                font-size: 35px;
            }

            .page {
                padding-top: 15px;
            }

            .chess-card {
                padding: 30px 22px 28px;
            }

            .chess-icon {
                height: 105px;
            }

            .knight {
                font-size: 90px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 18px;
            }

            .online-card {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="mountains">
        <div class="ground"></div>

        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>
    </div>

    <main class="page">

        <div class="logo">
            DuoPlay
        </div>

        <!-- CHESS ONLY -->
        <section class="chess-card">

            <div class="chess-icon">
                <div class="knight">♞</div>
            </div>

            <h1>Chess</h1>

            <p class="subtitle">
                Challenge another player and play together.
            </p>

            <button
                id="playChess"
                class="play-button"
            >
                PLAY CHESS
            </button>

            <div
                id="status"
                class="status"
            >
                Connecting to DuoPlay...
            </div>

        </section>

        <!-- PLAYERS ONLINE -->
        <section class="online-card">

            <div class="online-title">
                PLAYERS ONLINE
            </div>

            <p class="online-count">
                <span
                    id="onlineNumber"
                    class="online-number"
                >
                    0
                </span>

                <span id="onlineText">
                    Connecting to DuoPlay...
                </span>
            </p>

        </section>

    </main>

    <script>
        /* =====================================================
           DUOPLAY CONNECTION
        ===================================================== */

        const SERVER_URL =
            "https://duoplayserver.onrender.com";

        const socket =
            io(SERVER_URL, {
                transports: ["websocket", "polling"],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                timeout: 10000
            });

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const playButton =
            document.getElementById("playChess");

        const status =
            document.getElementById("status");

        const onlineNumber =
            document.getElementById("onlineNumber");

        const onlineText =
            document.getElementById("onlineText");

        /* =====================================================
           PLAYER ID
        ===================================================== */

        let clientId =
            localStorage.getItem("duoplay_client_id");

        if (!clientId) {

            clientId =
                "player-" +
                crypto.randomUUID();

            localStorage.setItem(
                "duoplay_client_id",
                clientId
            );
        }

        let playerName =
            localStorage.getItem("duoplay_player_name");

        if (!playerName) {
            playerName = "Player";
        }

        /* =====================================================
           CONNECTION
        ===================================================== */

        socket.on("connect", () => {

            console.log(
                "Connected to DuoPlay:",
                socket.id
            );

            status.textContent =
                "Ready to find an opponent.";

            status.className =
                "status";

            onlineText.textContent =
                "Ready to play";

            socket.emit(
                "player:register",
                {
                    clientId,
                    name: playerName
                }
            );

            updateOnlineCount();
        });

        socket.on("disconnect", () => {

            console.log(
                "Disconnected from DuoPlay"
            );

            status.textContent =
                "Connecting to DuoPlay...";

            status.className =
                "status";

            onlineText.textContent =
                "Connecting to DuoPlay...";
        });

        socket.on("connect_error", error => {

            console.error(
                "Socket connection error:",
                error
            );

            status.textContent =
                "Unable to connect to server.";

            status.className =
                "status error";

            onlineText.textContent =
                "Server connection unavailable";
        });

        /* =====================================================
           ONLINE COUNT
        ===================================================== */

        function updateOnlineCount() {

            /*
             * The server currently does not expose a
             * player-count socket event.
             *
             * Keep the display honest instead of using
             * a fake number.
             */

            if (socket.connected) {

                onlineNumber.textContent = "●";

                onlineText.textContent =
                    "DuoPlay connected";
            }
        }

        /* =====================================================
           PLAY CHESS
        ===================================================== */

        playButton.addEventListener(
            "click",
            () => {

                if (!socket.connected) {

                    status.textContent =
                        "Still connecting to DuoPlay...";

                    status.className =
                        "status error";

                    return;
                }

                playButton.disabled = true;

                playButton.textContent =
                    "FINDING OPPONENT...";

                status.textContent =
                    "Waiting for another player...";

                status.className =
                    "status waiting";

                socket.emit(
                    "chess:find",
                    {
                        clientId,
                        name: playerName
                    }
                );
            }
        );

        /* =====================================================
           WAITING
        ===================================================== */

        socket.on(
            "match:waiting",
            data => {

                playButton.disabled = true;

                playButton.textContent =
                    "WAITING FOR PLAYER...";

                status.textContent =
                    data?.message ||
                    "Waiting for another player...";

                status.className =
                    "status waiting";
            }
        );

        /* =====================================================
           MATCH FOUND
        ===================================================== */

        socket.on(
            "match:found",
            data => {

                console.log(
                    "Chess match found:",
                    data
                );

                status.textContent =
                    "Opponent found! Starting chess...";

                status.className =
                    "status";

                /*
                 * Store match information.
                 */

                if (data.roomId) {

                    sessionStorage.setItem(
                        "duoplay_room_id",
                        data.roomId
                    );
                }

                sessionStorage.setItem(
                    "duoplay_client_id",
                    clientId
                );

                /*
                 * Find our player color.
                 */

                if (Array.isArray(data.players)) {

                    const me =
                        data.players.find(
                            player =>
                                player.id === clientId
                        );

                    if (me && me.color) {

                        sessionStorage.setItem(
                            "duoplay_color",
                            me.color
                        );
                    }
                }

                /*
                 * Move to chess.
                 */

                setTimeout(
                    () => {

                        const params =
                            new URLSearchParams();

                        if (data.roomId) {
                            params.set(
                                "roomId",
                                data.roomId
                            );
                        }

                        params.set(
                            "clientId",
                            clientId
                        );

                        window.location.href =
                            "/chess.html?" +
                            params.toString();

                    },
                    400
                );
            }
        );

        /* =====================================================
           GAME START
        ===================================================== */

        socket.on(
            "game:start",
            data => {

                console.log(
                    "Game started:",
                    data
                );

                /*
                 * match:found normally handles
                 * navigation first.
                 *
                 * This is here as a backup.
                 */

                if (
                    data &&
                    data.roomId &&
                    !sessionStorage.getItem(
                        "duoplay_room_id"
                    )
                ) {

                    sessionStorage.setItem(
                        "duoplay_room_id",
                        data.roomId
                    );

                    window.location.href =
                        "/chess.html?roomId=" +
                        encodeURIComponent(
                            data.roomId
                        );
                }
            }
        );

        /* =====================================================
           SERVER CONNECTED
        ===================================================== */

        socket.on(
            "server:connected",
            data => {

                console.log(
                    "Server:",
                    data
                );
            }
        );

        /* =====================================================
           PREVENT ACCIDENTAL DOUBLE CLICK
        ===================================================== */

        window.addEventListener(
            "pageshow",
            () => {

                /*
                 * If the user comes back to this page,
                 * allow them to search again.
                 */

                playButton.disabled = false;

                playButton.textContent =
                    "PLAY CHESS";
            }
        );
    </script>

</body>
</html>
