<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuoPlay — Games</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;

    background:
        linear-gradient(
            180deg,
            #79c9c5 0%,
            #a8ddd0 34%,
            #709b70 68%,
            #153d2c 100%
        );
}

/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
}

.sun {
    position: absolute;
    width: 140px;
    height: 140px;
    top: 7%;
    right: 9%;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffde3,
            #ffe8a0 55%,
            #ffd36d
        );

    box-shadow:
        0 0 55px #ffe8a0;
}

.cloud {
    position: absolute;
    width: 190px;
    height: 45px;
    border-radius: 50px;
    background: rgba(255,255,255,.32);
    animation: cloudMove 50s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
}

.cloud::before {
    width: 80px;
    height: 80px;
    left: 25px;
    bottom: 0;
}

.cloud::after {
    width: 62px;
    height: 62px;
    right: 25px;
    bottom: 0;
}

.cloud.one {
    top: 15%;
    left: -230px;
}

.cloud.two {
    top: 30%;
    left: -350px;
    transform: scale(.7);
    animation-duration: 65s;
    animation-delay: -20s;
}

@keyframes cloudMove {
    from {
        margin-left: 0;
    }

    to {
        margin-left: calc(100vw + 600px);
    }
}

.mountains {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 21%;
    height: 46%;
}

.mountain {
    position: absolute;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 230px solid transparent;
    border-right: 230px solid transparent;
    border-bottom: 350px solid #628a80;
}

.mountain.one {
    left: -180px;
}

.mountain.two {
    left: 17%;
    transform: scale(.78);
}

.mountain.three {
    left: 43%;
    transform: scale(1.12);
    border-bottom-color: #547b71;
}

.mountain.four {
    left: 72%;
    transform: scale(.8);
}

.ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 22%;

    background:
        linear-gradient(
            to top,
            #153d2c,
            rgba(35,100,67,.72)
        );
}

/* =====================================================
   HEADER
===================================================== */

header {
    min-height: 72px;
    padding: 12px 24px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(8,47,37,.16);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.logo {
    font-family: Georgia, serif;
    font-size: 34px;
    font-weight: bold;
    color: #ffe19a;

    text-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

.my-id {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 10px 15px;
    border-radius: 25px;

    background: rgba(8,47,37,.62);
    border: 1px solid rgba(255,255,255,.15);

    font-size: 14px;
}

.id-label {
    color: #c7ded6;
}

#myId {
    color: #ffe29a;
    font-weight: bold;
    font-family: monospace;
    letter-spacing: 1px;
}

/* =====================================================
   MAIN
===================================================== */

main {
    width: min(850px, 94%);
    margin: 42px auto 60px;
}

.page-title {
    text-align: center;

    margin: 0;

    font-family: Georgia, serif;
    font-size: clamp(43px, 7vw, 68px);

    color: #fff1c3;

    text-shadow:
        0 5px 20px rgba(0,0,0,.22);
}

.page-subtitle {
    text-align: center;

    margin:
        8px 0 32px;

    color: #e1f1eb;
}

/* =====================================================
   PLAYERS PANEL
===================================================== */

.players-panel {
    padding: 25px;

    border-radius: 26px;

    background: rgba(8,47,37,.78);

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 25px 60px rgba(0,0,0,.27);

    backdrop-filter: blur(7px);
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}

.panel-title {
    color: #ffe5a0;

    font-family: monospace;
    font-size: 14px;
    letter-spacing: 2px;
}

.online-count {
    padding: 6px 11px;

    border-radius: 15px;

    background: rgba(255,255,255,.08);

    color: #dcece6;

    font-size: 13px;
}

/* =====================================================
   PLAYER LIST
===================================================== */

.player-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player-row {
    min-height: 64px;

    display: flex;
    align-items: center;

    padding: 9px 11px 9px 16px;

    border-radius: 15px;

    background: rgba(255,255,255,.065);

    border:
        1px solid rgba(255,255,255,.08);

    transition:
        background .15s ease,
        border .15s ease;
}

.player-row:hover {
    background: rgba(255,255,255,.10);
}

.player-row.selected {
    border-color: rgba(255,226,154,.55);

    background:
        rgba(255,226,154,.09);
}

.player-info {
    flex: 1;

    min-width: 0;

    display: flex;
    align-items: center;
    gap: 12px;

    cursor: pointer;
}

.online-dot {
    width: 10px;
    height: 10px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #61ed9b;

    box-shadow:
        0 0 9px #61ed9b;
}

.player-id {
    font-family: monospace;

    font-size: 16px;

    font-weight: bold;

    color: #f0f6f3;

    letter-spacing: 1px;
}

.you {
    margin-left: 5px;

    color: #b8d8ce;

    font-family: Arial, sans-serif;

    font-size: 12px;
    font-weight: normal;
}

/* =====================================================
   PLAY BUTTON
===================================================== */

.play-btn {
    display: none;

    border: 0;

    padding: 10px 18px;

    border-radius: 12px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #f7d987,
            #dca84f
        );

    color: #2c210f;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;
}

.player-row.selected .play-btn {
    display: block;
}

.play-btn:hover {
    filter: brightness(1.08);
}

.play-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.message {
    padding: 35px 20px;

    text-align: center;

    color: #c9dfd7;

    font-size: 14px;
}

.spinner {
    width: 25px;
    height: 25px;

    margin:
        0 auto 13px;

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,.15);

    border-top-color:
        #f1cf78;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   REQUEST POPUP
===================================================== */

.request-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter: blur(8px);
}

.request-overlay.show {
    display: flex;
}

.request-box {
    width: min(390px, 100%);

    padding: 30px 25px;

    border-radius: 25px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #164b3c,
            #082e24
        );

    border:
        1px solid rgba(255,255,255,.17);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55);
}

.request-icon {
    font-size: 52px;
    margin-bottom: 8px;
}

.request-box h2 {
    margin: 4px 0 8px;

    color: #ffe4a0;

    font-family: Georgia, serif;
}

.request-box p {
    margin: 0 0 22px;

    color: #c9dfd7;

    line-height: 1.5;
}

.request-buttons {
    display: flex;
    gap: 10px;
}

.request-buttons button {
    flex: 1;

    padding: 13px;

    border: 0;

    border-radius: 13px;

    cursor: pointer;

    font-weight: bold;
}

.accept-btn {
    background:
        linear-gradient(
            135deg,
            #f7d987,
            #dca84f
        );

    color: #2c210f;
}

.decline-btn {
    background:
        rgba(255,255,255,.10);

    color: white;

    border:
        1px solid rgba(255,255,255,.14) !important;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 200;

    transform:
        translate(-50%, 30px);

    opacity: 0;

    pointer-events: none;

    padding: 13px 19px;

    border-radius: 13px;

    background:
        rgba(7,32,26,.95);

    border:
        1px solid rgba(255,255,255,.15);

    color: white;

    font-size: 14px;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    header {
        padding: 10px 14px;
    }

    .logo {
        font-size: 27px;
    }

    .my-id {
        padding: 8px 11px;
        font-size: 11px;
    }

    main {
        margin-top: 25px;
    }

    .page-title {
        font-size: 45px;
    }

    .players-panel {
        padding: 16px;
    }

    .player-row {
        min-height: 60px;
    }

    .player-id {
        font-size: 14px;
    }

    .play-btn {
        padding: 9px 13px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="mountains">

        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>
        <div class="mountain four"></div>

    </div>

    <div class="ground"></div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        DuoPlay
    </div>

    <div class="my-id">

        <span class="id-label">
            Your ID
        </span>

        <span id="myId">
            Connecting...
        </span>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

    <h1 class="page-title">
        Game Room
    </h1>

    <p class="page-subtitle">
        Select a player and challenge them to Chess.
    </p>


    <!-- =================================================
         PLAYERS
    ================================================== -->

    <section class="players-panel">

        <div class="panel-header">

            <div class="panel-title">
                PLAYERS ONLINE
            </div>

            <div
                id="onlineCount"
                class="online-count"
            >
                0 online
            </div>

        </div>


        <div
            id="playerList"
            class="player-list"
        >

            <div class="message">

                <div class="spinner"></div>

                Finding online players...

            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     CHESS REQUEST
===================================================== -->

<div
    id="requestOverlay"
    class="request-overlay"
>

    <div class="request-box">

        <div class="request-icon">
            ♟
        </div>

        <h2>
            Chess Challenge
        </h2>

        <p>
            <strong id="requestPlayer">
                DP-XXXX
            </strong>
            wants to play Chess with you.
        </p>

        <div class="request-buttons">

            <button
                id="declineBtn"
                class="decline-btn"
            >
                DECLINE
            </button>

            <button
                id="acceptBtn"
                class="accept-btn"
            >
                ACCEPT
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast"
>
</div>


<script>

/* =====================================================
   SERVER
===================================================== */

const SERVER =
    window.location.origin;


/* =====================================================
   PERMANENT PLAYER ID
===================================================== */

/*
    IMPORTANT:

    The ID is generated ONCE.

    It is stored in localStorage.

    Refreshing the page does NOT create
    another ID.
*/

let myPlayerId =
    localStorage.getItem(
        "duoplayPlayerId"
    );


/*
    If this browser has never received
    an ID, the server will create one.
*/

const socket =
    io(
        SERVER,
        {
            transports: [
                "websocket",
                "polling"
            ],

            auth: {
                playerId:
                    myPlayerId || null
            },

            reconnection: true
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const myIdElement =
    document.getElementById(
        "myId"
    );

const playerList =
    document.getElementById(
        "playerList"
    );

const onlineCount =
    document.getElementById(
        "onlineCount"
    );

const requestOverlay =
    document.getElementById(
        "requestOverlay"
    );

const requestPlayer =
    document.getElementById(
        "requestPlayer"
    );

const acceptBtn =
    document.getElementById(
        "acceptBtn"
    );

const declineBtn =
    document.getElementById(
        "declineBtn"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   STATE
===================================================== */

let players = [];

let selectedSocketId = null;

let incomingRequestSocketId = null;


/* =====================================================
   SHOW TOAST
===================================================== */

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =====================================================
   SAVE PLAYER ID
===================================================== */

function savePlayerId(id) {

    if (!id) {
        return;
    }

    myPlayerId =
        String(id)
            .trim()
            .toUpperCase();

    localStorage.setItem(
        "duoplayPlayerId",
        myPlayerId
    );

    myIdElement.textContent =
        myPlayerId;

}


/* =====================================================
   SERVER GIVES US OUR ID
===================================================== */

socket.on(
    "yourId",
    id => {

        savePlayerId(id);

        /*
            After receiving the ID,
            ask the server for players.
        */

        socket.emit(
            "getPlayers"
        );

    }
);


/* =====================================================
   CONNECTION
===================================================== */

socket.on(
    "connect",
    () => {

        console.log(
            "Connected:",
            socket.id
        );

        /*
            If we already had a permanent ID,
            tell the server to use it.
        */

        if (myPlayerId) {

            socket.emit(
                "identify",
                myPlayerId
            );

        }

        socket.emit(
            "getPlayers"
        );

    }
);


/* =====================================================
   CONNECTION ERROR
===================================================== */

socket.on(
    "connect_error",
    error => {

        console.error(
            error
        );

        myIdElement.textContent =
            "Offline";

        showToast(
            "Could not connect to server."
        );

    }
);


/* =====================================================
   PLAYER LIST
===================================================== */

socket.on(
    "players",
    list => {

        if (!Array.isArray(list)) {
            return;
        }

        players =
            list;

        renderPlayers();

    }
);


/* =====================================================
   RENDER PLAYERS
===================================================== */

function renderPlayers() {

    /*
        Sort player IDs alphabetically.
    */

    players.sort(
        (a, b) =>
            String(a.playerId)
                .localeCompare(
                    String(b.playerId)
                )
    );


    onlineCount.textContent =
        `${players.length} online`;


    /*
        No players.
    */

    if (players.length === 0) {

        playerList.innerHTML = `
            <div class="message">
                No players online.
            </div>
        `;

        return;

    }


    playerList.innerHTML = "";


    players.forEach(
        player => {

            const isMe =
                player.playerId ===
                myPlayerId;

            /*
                Never show a PLAY button
                for yourself.
            */

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "player-row";


            if (
                selectedSocketId ===
                player.socketId
            ) {

                row.classList.add(
                    "selected"
                );

            }


            /* -----------------------------------------
               PLAYER INFO
            ----------------------------------------- */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "player-info";


            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "online-dot";


            const id =
                document.createElement(
                    "span"
                );

            id.className =
                "player-id";

            id.textContent =
                player.playerId;


            info.appendChild(
                dot
            );

            info.appendChild(
                id
            );


            if (isMe) {

                const you =
                    document.createElement(
                        "span"
                    );

                you.className =
                    "you";

                you.textContent =
                    "(You)";

                id.appendChild(
                    you
                );

            }


            row.appendChild(
                info
            );


            /* -----------------------------------------
               PLAY BUTTON
            ----------------------------------------- */

            if (!isMe) {

                const play =
                    document.createElement(
                        "button"
                    );

                play.className =
                    "play-btn";

                play.textContent =
                    "PLAY";

                play.onclick =
                    event => {

                        event.stopPropagation();

                        sendPlayRequest(
                            player.socketId,
                            player.playerId,
                            play
                        );

                    };


                row.appendChild(
                    play
                );

            }


            /* -----------------------------------------
               SELECT PLAYER
            ----------------------------------------- */

            info.onclick =
                () => {

                    if (isMe) {
                        return;
                    }

                    if (
                        selectedSocketId ===
                        player.socketId
                    ) {

                        selectedSocketId =
                            null;

                    }
                    else {

                        selectedSocketId =
                            player.socketId;

                    }

                    renderPlayers();

                };


            playerList.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   SEND PLAY REQUEST
===================================================== */

function sendPlayRequest(
    socketId,
    playerId,
    button
) {

    if (!socket.connected) {

        showToast(
            "You are not connected."
        );

        return;

    }

    if (
        !socketId ||
        !playerId
    ) {

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "SENT";


    socket.emit(
        "playRequest",
        socketId
    );


    showToast(
        `Chess request sent to ${playerId}`
    );


    /*
        Re-enable after a short time.
        This prevents accidental double requests.
    */

    setTimeout(
        () => {

            if (
                button.isConnected
            ) {

                button.disabled =
                    false;

                button.textContent =
                    "PLAY";

            }

        },
        3000
    );

}


/* =====================================================
   INCOMING PLAY REQUEST
===================================================== */

socket.on(
    "playRequest",
    data => {

        if (!data) {
            return;
        }

        incomingRequestSocketId =
            data.fromSocketId;


        requestPlayer.textContent =
            data.fromPlayerId ||
            "Player";


        requestOverlay.classList.add(
            "show"
        );

    }
);


/* =====================================================
   ACCEPT
===================================================== */

acceptBtn.onclick =
    () => {

        if (
            !incomingRequestSocketId
        ) {
            return;
        }


        acceptBtn.disabled =
            true;

        declineBtn.disabled =
            true;


        socket.emit(
            "acceptRequest",
            incomingRequestSocketId
        );


        requestOverlay.classList.remove(
            "show"
        );


        showToast(
            "Starting Chess..."
        );

    };


/* =====================================================
   DECLINE
===================================================== */

declineBtn.onclick =
    () => {

        if (
            incomingRequestSocketId
        ) {

            socket.emit(
                "declineRequest",
                incomingRequestSocketId
            );

        }


        incomingRequestSocketId =
            null;

        requestOverlay.classList.remove(
            "show"
        );

    };


/* =====================================================
   REQUEST DECLINED
===================================================== */

socket.on(
    "requestDeclined",
    data => {

        showToast(
            "Your Chess request was declined."
        );

    }
);


/* =====================================================
   REQUEST ERROR
===================================================== */

socket.on(
    "requestError",
    message => {

        showToast(
            message ||
            "Unable to send request."
        );

    }
);


/* =====================================================
   GAME READY
===================================================== */

socket.on(
    "gameReady",
    data => {

        if (!data) {
            return;
        }


        /*
            Save complete game information.
        */

        localStorage.setItem(
            "duoplayGame",
            JSON.stringify(data)
        );


        if (data.roomId) {

            localStorage.setItem(
                "duoplayRoomId",
                data.roomId
            );

        }


        /*
            Open Chess.
        */

        showToast(
            "Chess game ready!"
        );


        setTimeout(
            () => {

                window.location.href =
                    "/chess.html";

            },
            300
        );

    }
);


/* =====================================================
   OPPONENT LEFT
===================================================== */

socket.on(
    "opponentLeft",
    data => {

        showToast(
            "The other player left the game."
        );

    }
);


/* =====================================================
   ID ERROR
===================================================== */

socket.on(
    "idError",
    message => {

        /*
            Normally this should not happen.

            If another active browser is already
            using this ID, the server will reject
            the ID.

            We then remove the old stored ID and
            reconnect so a new permanent ID can
            be assigned.

            This is only for an actual duplicate.
        */

        console.warn(
            "ID error:",
            message
        );

        localStorage.removeItem(
            "duoplayPlayerId"
        );

        showToast(
            "Player ID conflict. Reconnecting..."
        );

    }
);


/* =====================================================
   DISCONNECT
===================================================== */

socket.on(
    "disconnect",
    () => {

        console.log(
            "Disconnected"
        );

        onlineCount.textContent =
            "Offline";

    }
);


/* =====================================================
   INITIAL DISPLAY
===================================================== */

if (myPlayerId) {

    myIdElement.textContent =
        myPlayerId;

}
else {

    myIdElement.textContent =
        "Creating ID...";

}


/* =====================================================
   REFRESH PLAYER LIST
===================================================== */

setInterval(
    () => {

        if (
            socket.connected
        ) {

            socket.emit(
                "getPlayers"
            );

        }

    },
    3000
);

</script>

</body>
</html>
