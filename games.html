<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuoPlay - Games</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;

    background:
        linear-gradient(
            rgba(8, 45, 35, 0.18),
            rgba(8, 45, 35, 0.55)
        ),
        linear-gradient(
            180deg,
            #b8e4d8 0%,
            #8fc5aa 45%,
            #467b5c 72%,
            #164633 100%
        );
}

/* ================= HEADER ================= */

.header {
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(4, 35, 28, 0.76);

    border-bottom:
        1px solid rgba(255,255,255,0.12);
}

.logo {
    font-size: 28px;
    font-weight: 800;
    color: #fff0b5;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 14px;
}

.status-dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #e4a94f;
}

.status-dot.online {
    background: #35d47a;
}

/* ================= MAIN ================= */

.main {
    width: min(1050px, 94%);

    margin: 30px auto;
}

.title {
    font-size: 32px;
    font-weight: 800;

    margin-bottom: 8px;
}

.subtitle {
    color: rgba(255,255,255,0.78);

    margin-bottom: 24px;
}

/* ================= CHESS CARD ================= */

.chess-card {
    background: rgba(5, 55, 43, 0.91);

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 18px 45px rgba(0,0,0,0.25);
}

.chess-top {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.chess-name {
    font-size: 25px;
    font-weight: 800;
}

.chess-description {
    color: #d9e8df;
    margin-top: 5px;
}

.play-online {
    border: 0;

    padding: 12px 20px;

    border-radius: 13px;

    background: #e5b957;

    color: #17392e;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;
}

.play-online:hover {
    filter: brightness(1.08);
}

/* ================= ONLINE ================= */

.online-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 14px;
}

.online-title h2 {
    margin: 0;

    font-size: 20px;
}

.online-count {
    color: #f2d276;

    font-size: 14px;
}

.players {
    display: flex;
    flex-direction: column;

    gap: 10px;
}

.player {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 14px 16px;

    border-radius: 14px;

    background: rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.08);
}

.player-left {
    display: flex;

    align-items: center;

    gap: 11px;
}

.online-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #35d47a;
}

.player-id {
    font-weight: 700;

    letter-spacing: 0.5px;
}

.play-button {
    border: 0;

    padding: 9px 18px;

    border-radius: 10px;

    background: #e5b957;

    color: #17392e;

    font-weight: 800;

    cursor: pointer;
}

.play-button:hover {
    filter: brightness(1.08);
}

.play-button:disabled {
    opacity: 0.45;

    cursor: not-allowed;
}

/* ================= EMPTY ================= */

.empty {
    padding: 30px;

    text-align: center;

    color: rgba(255,255,255,0.65);

    background: rgba(255,255,255,0.04);

    border-radius: 15px;
}

/* ================= MESSAGE ================= */

.message {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%)
        translateY(120px);

    min-width: 260px;
    max-width: 90%;

    padding: 14px 20px;

    border-radius: 13px;

    background: rgba(4, 30, 24, 0.95);

    box-shadow:
        0 12px 35px rgba(0,0,0,0.3);

    text-align: center;

    transition:
        transform 0.25s ease;

    z-index: 100;
}

.message.show {
    transform:
        translateX(-50%)
        translateY(0);
}

.message.error {
    border:
        1px solid rgba(255,100,100,0.4);
}

/* ================= CHALLENGE ================= */

.challenge-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.55);

    z-index: 200;

    padding: 20px;
}

.challenge-overlay.show {
    display: flex;
}

.challenge-box {
    width: min(400px, 100%);

    padding: 30px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #174f3e,
            #082e24
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    text-align: center;
}

.challenge-title {
    font-size: 25px;

    font-weight: 800;

    margin-bottom: 10px;
}

.challenge-player {
    font-size: 21px;

    color: #f2d276;

    font-weight: 800;

    margin: 15px 0 25px;
}

.challenge-buttons {
    display: flex;

    gap: 12px;
}

.challenge-buttons button {
    flex: 1;

    border: 0;

    padding: 13px;

    border-radius: 12px;

    font-weight: 800;

    cursor: pointer;
}

.accept {
    background: #e5b957;

    color: #17392e;
}

.reject {
    background: rgba(255,255,255,0.1);

    color: white;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 650px) {

    .header {
        padding: 0 15px;
    }

    .logo {
        font-size: 23px;
    }

    .main {
        width: 96%;
        margin-top: 20px;
    }

    .title {
        font-size: 27px;
    }

    .chess-top {
        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }

    .play-online {
        width: 100%;
    }

    .player {
        padding: 12px;
    }

    .play-button {
        padding: 8px 14px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        DuoPlay
    </div>

    <div class="status">

        <span
            id="statusDot"
            class="status-dot">
        </span>

        <span id="statusText">
            Connecting...
        </span>

    </div>

</header>


<main class="main">

    <div class="title">
        Games
    </div>

    <div class="subtitle">
        Choose a player and start a Chess match.
    </div>


    <section class="chess-card">

        <div class="chess-top">

            <div>

                <div class="chess-name">
                    Chess
                </div>

                <div class="chess-description">
                    Play Chess against another online player.
                </div>

            </div>

            <button
                class="play-online"
                onclick="findPlayer()">

                Find Player

            </button>

        </div>


        <div class="online-title">

            <h2>
                Online Players
            </h2>

            <div
                class="online-count"
                id="onlineCount">

                0 online

            </div>

        </div>


        <div
            class="players"
            id="players">

            <div class="empty">
                Looking for online players...
            </div>

        </div>

    </section>

</main>


<!-- ================= CHALLENGE POPUP ================= -->

<div
    id="challengeOverlay"
    class="challenge-overlay">

    <div class="challenge-box">

        <div class="challenge-title">
            Chess Challenge
        </div>

        <div>
            Player
        </div>

        <div
            id="challengePlayer"
            class="challenge-player">

            DP-000000

        </div>

        <div class="challenge-buttons">

            <button
                class="reject"
                onclick="rejectChallenge()">

                Reject

            </button>

            <button
                class="accept"
                onclick="acceptChallenge()">

                Accept

            </button>

        </div>

    </div>

</div>


<div
    id="message"
    class="message">
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SERVER_URL =
    "https://duoplayserver.onrender.com";


/* =========================================================
   SOCKET
========================================================= */

const socket =
    io(SERVER_URL, {
        transports: [
            "websocket",
            "polling"
        ]
    });


/* =========================================================
   PLAYER ID
========================================================= */

let playerId =
    localStorage.getItem(
        "duoplay_player_id"
    );


/* =========================================================
   CURRENT CHALLENGE
========================================================= */

let currentChallengeId =
    null;


/* =========================================================
   ELEMENTS
========================================================= */

const playersElement =
    document.getElementById(
        "players"
    );

const onlineCountElement =
    document.getElementById(
        "onlineCount"
    );

const statusTextElement =
    document.getElementById(
        "statusText"
    );

const statusDotElement =
    document.getElementById(
        "statusDot"
    );

const challengeOverlay =
    document.getElementById(
        "challengeOverlay"
    );

const challengePlayer =
    document.getElementById(
        "challengePlayer"
    );

const messageElement =
    document.getElementById(
        "message"
    );


/* =========================================================
   CONNECTED
========================================================= */

socket.on(
    "connect",
    () => {

        statusTextElement.textContent =
            "Connected";

        statusDotElement.classList.add(
            "online"
        );


        /*
         * Give the server our saved ID.
         *
         * If there is no ID,
         * server creates one.
         */

        socket.emit(
            "register-player",
            playerId || null
        );

    }
);


/* =========================================================
   DISCONNECTED
========================================================= */

socket.on(
    "disconnect",
    () => {

        statusTextElement.textContent =
            "Disconnected";

        statusDotElement.classList.remove(
            "online"
        );

    }
);


/* =========================================================
   REGISTERED
========================================================= */

socket.on(
    "player-registered",
    (data) => {

        if (
            !data ||
            !data.playerId
        ) {
            return;
        }


        playerId =
            data.playerId;


        /*
         * THIS IS THE IMPORTANT PART.
         *
         * The same ID stays in this browser.
         */

        localStorage.setItem(
            "duoplay_player_id",
            playerId
        );


        socket.emit(
            "get-online-players"
        );

    }
);


/* =========================================================
   ONLINE PLAYERS
========================================================= */

socket.on(
    "players-online",
    (players) => {

        renderPlayers(players);

    }
);


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers(players) {

    if (!Array.isArray(players)) {
        players = [];
    }


    /*
     * Don't show ourselves.
     */

    const others =
        players.filter(
            player =>
                player.playerId !==
                playerId
        );


    onlineCountElement.textContent =
        `${others.length} online`;


    if (others.length === 0) {

        playersElement.innerHTML = `
            <div class="empty">
                No other players online.
            </div>
        `;

        return;
    }


    playersElement.innerHTML = "";


    others.forEach(
        player => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "player";


            const left =
                document.createElement(
                    "div"
                );

            left.className =
                "player-left";


            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "online-dot";


            const id =
                document.createElement(
                    "span"
                );

            id.className =
                "player-id";

            id.textContent =
                player.playerId;


            left.appendChild(dot);
            left.appendChild(id);


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "play-button";

            button.textContent =
                "PLAY";


            /*
             * One click = challenge that player.
             */

            button.onclick =
                () => challengePlayer(
                    player.playerId
                );


            if (player.inGame) {

                button.disabled =
                    true;

                button.textContent =
                    "IN GAME";

            }


            row.appendChild(left);
            row.appendChild(button);

            playersElement.appendChild(
                row
            );

        }
    );
}


/* =========================================================
   CHALLENGE PLAYER
========================================================= */

function challengePlayer(
    targetPlayerId
) {

    if (!targetPlayerId) {
        return;
    }


    if (!socket.connected) {

        showMessage(
            "Not connected to server.",
            true
        );

        return;
    }


    socket.emit(
        "challenge-player",
        targetPlayerId
    );


    showMessage(
        "Challenge sent. Waiting for acceptance..."
    );

}


/* =========================================================
   CHALLENGE SENT
========================================================= */

socket.on(
    "challenge-sent",
    (data) => {

        showMessage(
            "Challenge sent to " +
            data.targetPlayerId
        );

    }
);


/* =========================================================
   INCOMING CHALLENGE
========================================================= */

socket.on(
    "chess-challenge",
    (data) => {

        if (
            !data ||
            !data.challengeId
        ) {
            return;
        }


        currentChallengeId =
            data.challengeId;


        challengePlayer.textContent =
            data.fromPlayerId;


        challengeOverlay.classList.add(
            "show"
        );

    }
);


/* =========================================================
   ACCEPT
========================================================= */

function acceptChallenge() {

    if (!currentChallengeId) {
        return;
    }


    socket.emit(
        "accept-challenge",
        currentChallengeId
    );


    challengeOverlay.classList.remove(
        "show"
    );


    showMessage(
        "Starting Chess..."
    );
}


/* =========================================================
   REJECT
========================================================= */

function rejectChallenge() {

    if (!currentChallengeId) {
        return;
    }


    socket.emit(
        "reject-challenge",
        currentChallengeId
    );


    currentChallengeId =
        null;


    challengeOverlay.classList.remove(
        "show"
    );
}


/* =========================================================
   CHALLENGE REJECTED
========================================================= */

socket.on(
    "challenge-rejected",
    () => {

        showMessage(
            "Your Chess challenge was rejected.",
            true
        );

    }
);


/* =========================================================
   CHESS GAME START
========================================================= */

socket.on(
    "chess-game-start",
    (data) => {

        console.log(
            "CHESS GAME START:",
            data
        );


        if (
            !data ||
            !data.gameId
        ) {

            showMessage(
                "Chess game could not start.",
                true
            );

            return;
        }


        /*
         * SAVE THE SAME GAME INFORMATION
         * BEFORE OPENING chess.html.
         */

        sessionStorage.setItem(
            "duoplay_game_id",
            data.gameId
        );

        sessionStorage.setItem(
            "duoplay_game_color",
            data.color
        );

        sessionStorage.setItem(
            "duoplay_opponent_id",
            data.opponentId
        );


        /*
         * Both players receive the same
         * gameId from server.
         */

        window.location.href =
            "chess.html?gameId=" +
            encodeURIComponent(
                data.gameId
            ) +
            "&color=" +
            encodeURIComponent(
                data.color
            );

    }
);


/* =========================================================
   SERVER ERROR
========================================================= */

socket.on(
    "error-message",
    (message) => {

        showMessage(
            message ||
            "Something went wrong.",
            true
        );

    }
);


/* =========================================================
   FIND PLAYER
========================================================= */

function findPlayer() {

    const firstPlayer =
        document.querySelector(
            ".play-button:not(:disabled)"
        );


    if (firstPlayer) {

        firstPlayer.click();

    } else {

        showMessage(
            "No available player found."
        );

    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(
    text,
    error = false
) {

    messageElement.textContent =
        text;

    messageElement.classList.toggle(
        "error",
        error
    );

    messageElement.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                messageElement.classList.remove(
                    "show"
                );

            },
            3500
        );
}


/* =========================================================
   INITIAL
========================================================= */

if (socket.connected) {

    socket.emit(
        "get-online-players"
    );

}

</script>

</body>
</html>
